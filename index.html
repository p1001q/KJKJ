<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끄적끄적</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeon+Sung&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #e6dfd2;
    --paper: #f8f4ea;
    --ink: #34343b;
    --muted: #8a8478;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--desk);
    padding: 24px 16px 96px;
    font-family: "Yeon Sung", cursive;
    color: var(--ink);
  }
  .paper {
    position: relative;
    width: 100%;
    background-color: var(--paper);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .40  0 0 0 0 .30  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 34px rgba(0,0,0,.12);
  }
  .sheet { max-width: 820px; margin: 0 auto; }
  /* 구겨지는 동안: 종이 모양을 따라가는 그림자를 종이 바깥(래퍼)에 둬서 클립에 잘리지 않고 농도도 일정하다 */
  .sheet.shadowed { filter: drop-shadow(0 10px 14px rgba(70,55,30,.30)); }
  .sheet.shadowed .paper { box-shadow: none; }
  #board { display: block; width: 100%; overflow: visible; }
  #tools { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; pointer-events: none; }
  .tool { position: absolute; left: 0; top: 0; overflow: visible; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  #pad {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; resize: none; font-size: 16px; cursor: text; overflow: hidden;
  }
  .lead { fill: none; stroke: var(--ink); stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; transition: opacity .18s; }
  .hi   { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .7; transform: translate(.9px,.9px); transition: opacity .18s; }
  .fade .lead, .fade .hi { opacity: 0; }
  .erasing { transition: none !important; }
  .sel { opacity: .35; }
  .rule { stroke: rgba(110,130,160,.38); stroke-width: 1; }
  .margin { stroke: rgba(210,110,110,.38); stroke-width: 1; }
  .stats {
    position: absolute; left: 16px; bottom: 10px; z-index: 1;
    font-size: 18px; color: #c6bca6; pointer-events: none; user-select: none;
  }
  .toolbar, .side {
    position: fixed; bottom: 18px; z-index: 5;
    background: rgba(248,244,234,.97);
    box-shadow: 0 4px 16px rgba(0,0,0,.14);
    font-size: 20px; white-space: nowrap;
  }
  .toolbar {
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; align-items: center;
    border-radius: 999px; padding: 6px 10px; max-width: calc(100vw - 16px);
  }
  .side { right: 16px; border-radius: 18px; padding: 6px 10px; display: grid; gap: 2px; }
  .side .row { display: flex; align-items: center; gap: 2px; }
  .side .lbl { color: var(--muted); width: 2.3em; padding-left: 4px; }
  .side .val { color: var(--ink); min-width: 3.4em; text-align: center; }
  .toolbar button, .side button {
    font: inherit; color: var(--ink); background: transparent; border: 0;
    border-radius: 999px; padding: 2px 12px; cursor: pointer; opacity: .8;
  }
  .side button { padding: 0 10px; }
  .toolbar button:hover, .side button:hover { opacity: 1; background: rgba(127,127,127,.15); }
  .menuWrap { position: relative; }
  .menu {
    position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%);
    display: none; flex-direction: column; gap: 2px; padding: 4px;
    background: rgba(248,244,234,.98); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .menu.open { display: flex; }
  #clear { display: flex; align-items: center; }
  #clear svg { display: block; }
  #clear.bump svg { animation: bump .4s ease; }
  @keyframes bump { 0%,100% { transform: none; } 30% { transform: scale(1.25) rotate(-8deg); } 60% { transform: scale(.95) rotate(5deg); } }
  .caret {
    position: absolute; left: 0; top: 0; width: 2px; border-radius: 1px;
    background: var(--ink); pointer-events: none; z-index: 2; display: none;
  }
  .caret.blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  .paper.crumple { pointer-events: none; }
  .wrinkle { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  #ball { position: fixed; z-index: 60; width: 150px; height: 150px; display: none; pointer-events: none; filter: drop-shadow(0 10px 14px rgba(70,55,30,.30)); }
  #ball.fly { animation: ballfly .45s linear forwards; }
  @keyframes ballfly {
    0% { transform: translate(calc(var(--bx) * 0.0), calc(var(--by) * 0.0 - 0px)) scale(1.000) rotate(0deg); }
    10% { transform: translate(calc(var(--bx) * 0.1), calc(var(--by) * 0.1 - 25px)) scale(0.983) rotate(30deg); }
    20% { transform: translate(calc(var(--bx) * 0.2), calc(var(--by) * 0.2 - 45px)) scale(0.967) rotate(60deg); }
    30% { transform: translate(calc(var(--bx) * 0.3), calc(var(--by) * 0.3 - 59px)) scale(0.950) rotate(90deg); }
    40% { transform: translate(calc(var(--bx) * 0.4), calc(var(--by) * 0.4 - 67px)) scale(0.933) rotate(120deg); }
    50% { transform: translate(calc(var(--bx) * 0.5), calc(var(--by) * 0.5 - 70px)) scale(0.917) rotate(150deg); }
    60% { transform: translate(calc(var(--bx) * 0.6), calc(var(--by) * 0.6 - 67px)) scale(0.900) rotate(180deg); }
    70% { transform: translate(calc(var(--bx) * 0.7), calc(var(--by) * 0.7 - 59px)) scale(0.815) rotate(210deg); }
    80% { transform: translate(calc(var(--bx) * 0.8), calc(var(--by) * 0.8 - 45px)) scale(0.660) rotate(240deg); }
    90% { transform: translate(calc(var(--bx) * 0.9), calc(var(--by) * 0.9 - 25px)) scale(0.458) rotate(270deg); }
    100% { transform: translate(calc(var(--bx) * 1.0), calc(var(--by) * 1.0 - 0px)) scale(0.220) rotate(300deg); }
  }
  .paper.fresh { animation: fresh .4s ease-out; }
  @keyframes fresh { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 900px) { .side { bottom: 72px; } }
  @media (max-width: 560px) {
    .toolbar, .side { font-size: 16px; }
    .toolbar { padding: 4px 6px; }
    .toolbar button { padding: 2px 6px; }
    .stats { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="sheet" id="sheet">
<div class="paper" id="paper">
  <svg id="board" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 흑연 입자: 한 번만 만든 노이즈 타일을 마스크로 씌운다 (필터 연산 없음) -->
      <pattern id="grainPat" patternUnits="userSpaceOnUse" width="128" height="128">
        <image id="grainImg" width="128" height="128"/>
      </pattern>
      <mask id="grainMask" maskUnits="userSpaceOnUse" x="0" y="0" width="4000" height="30000">
        <rect width="4000" height="30000" fill="url(#grainPat)"/>
      </mask>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    </defs>
    <g id="rules"></g>
    <g id="glyphs" mask="url(#grainMask)"></g>
  </svg>
  <div id="tools">
    <svg id="penTool" class="tool" width="1" height="1">
      <g id="pshadow" opacity=".22" filter="url(#soft)">
        <polygon points="0,0 12,-3.2 30,-5.5 176,-5.5 176,5.5 30,5.5 12,3.2" fill="#000" transform="rotate(-62)"/>
      </g>
      <g transform="rotate(-62)">
        <polygon points="0,0 12,-3.2 12,3.2" fill="#3a3a40"/>
        <polygon points="12,-3.2 32,-5.5 32,5.5 12,3.2" fill="#e8c9a0"/>
        <rect x="32" y="-5.5" width="118" height="11" fill="#e2677a"/>
        <rect x="32" y="-5.5" width="118" height="3" fill="#f08a99"/>
        <rect x="150" y="-5.5" width="12" height="11" fill="#b9b9c0"/>
        <rect x="162" y="-5.5" width="14" height="11" rx="3" fill="#f0a3ab"/>
      </g>
    </svg>
    <svg id="eraserTool" class="tool" width="1" height="1" style="display:none">
      <g id="eshadow" opacity=".22" filter="url(#soft)">
        <rect x="-22" y="-28" width="44" height="28" rx="5" fill="#000" transform="rotate(-16)"/>
      </g>
      <g transform="rotate(-16)">
        <rect x="-22" y="-28" width="44" height="28" rx="5" fill="#f7f1e6" stroke="#d3c9b6"/>
        <path d="M-22 -23 a5 5 0 0 1 5 -5 h34 a5 5 0 0 1 5 5 v13 h-44z" fill="#5f84d4"/>
      </g>
    </svg>
  </div>
  <div class="stats" id="stats"></div>
  <div class="caret" id="caret"></div>
  <textarea id="pad" spellcheck="false" autofocus aria-label="글 입력"></textarea>
</div>
</div>

<canvas id="ball" width="300" height="300"></canvas>

<div class="toolbar">
  <button id="freeBtn">종이 고정 켜짐</button>
  <button id="pencilBtn">연필 켜짐</button>
  <button id="sound">소리 켜짐</button>
  <div class="menuWrap">
    <button id="copy">복사</button>
    <div class="menu" id="copyMenu">
      <button id="copyText">글 복사</button>
      <button id="copyImg">이미지 복사</button>
    </div>
  </div>
  <button id="save">저장</button>
  <button id="clear" aria-label="종이 버리기" title="종이 버리기">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="lid" d="M4 7h16M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>
    </svg>
  </button>
</div>

<div class="side">
  <div class="row"><span class="lbl">확대</span><button id="zoomOut" aria-label="축소">−</button><span class="val" id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대">+</button></div>
  <div class="row"><span class="lbl">속도</span><button id="speedDown" aria-label="느리게">−</button><span class="val" id="speedLabel">1×</span><button id="speedUp" aria-label="빠르게">+</button></div>
</div>

<script>
(() => {
  // ───────── 레이아웃 상수 ─────────
  const G = 46;          // 글자 칸 크기
  const LH = 64;         // 줄 간격
  const ML = 84;         // 왼쪽 여백
  const MT = 10;         // 위쪽 여백
  const NS = 'http://www.w3.org/2000/svg';
  const numRe = /-?\d*\.?\d+/g;
  // 이모지(❤️, 1️⃣, 👨‍👩‍👧 …)는 여러 코드포인트가 한 글자이므로 자소 단위로 쪼갠다
  const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  const chars = t => segmenter ? Array.from(segmenter.segment(t), x => x.segment) : Array.from(t);
  const EMOJI_RE = /\p{Extended_Pictographic}|\u20E3/u;
  const isEmoji = ch => EMOJI_RE.test(ch) && !/^[\u00A9\u00AE\u2122]\uFE0F?$/.test(ch);
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  const ZOOMS = [0.5, 0.65, 0.8, 1, 1.25, 1.5, 1.8];
  let zi = 3, Z = 1;
  const SPEEDS = [0.5, 0.75, 1, 1.5, 2, 3];
  let si = 2, userSpeed = 1;
  let pencilOn = true;
  let grainUrl = '';
  let freeMode = true;                 // 종이 고정 모드
  let committed = [];                  // 종이 고정: 확정된 글자들 (좌표 고정)
  let anchor = { row: 0, x: ML };      // 종이 고정: 지금 쓰고 있는 자리
  let freeSel = [];                    // 종이 고정: 선택된 글자들
  let selAnchor = null;                // 선택을 시작한 자리
  let layoutW = 0, layoutH = 0;

  // ───────── 획 데이터 (0~100 상자, 획순대로) ─────────
  const S = {
    'ㄱ': ['M12 14 L88 14 L88 90'],
    'ㄴ': ['M14 10 L14 86 L90 86'],
    'ㄷ': ['M12 14 L88 14', 'M12 14 L12 86 L88 86'],
    'ㄹ': ['M12 12 L88 12 L88 46 L12 46', 'M12 46 L12 88 L88 88'],
    'ㅁ': ['M14 12 L14 88', 'M14 12 L86 12 L86 88', 'M14 88 L86 88'],
    'ㅂ': ['M18 10 L18 90', 'M82 10 L82 90', 'M18 50 L82 50', 'M18 90 L82 90'],
    'ㅅ': ['M50 12 C 46 44 30 70 10 90', 'M38 42 C 54 62 72 78 90 90'],
    'ㅇ': ['M50 10 C 74 10 90 28 90 50 C 90 72 74 90 50 90 C 26 90 10 72 10 50 C 10 28 26 10 50 10'],
    'ㅈ': ['M12 14 L88 14', 'M52 14 C 46 46 30 72 10 90', 'M42 46 C 56 66 74 80 90 90'],
    'ㅊ': ['M34 6 L66 6', 'M12 26 L88 26', 'M52 26 C 46 54 30 76 10 92', 'M42 54 C 56 72 74 84 90 92'],
    'ㅋ': ['M12 12 L88 12 L88 88', 'M12 50 L88 50'],
    'ㅌ': ['M88 12 L12 12 L12 88 L88 88', 'M12 50 L78 50'],
    'ㅍ': ['M10 12 L90 12', 'M32 12 L32 88', 'M68 12 L68 88', 'M10 88 L90 88'],
    'ㅎ': ['M34 8 L66 8', 'M14 26 L86 26',
          'M50 38 C 66 38 74 50 74 60 C 74 74 64 84 50 84 C 36 84 26 74 26 60 C 26 50 34 38 50 38'],

    'ㅏ': ['M36 4 L36 96', 'M36 50 L88 50'],
    'ㅑ': ['M34 4 L34 96', 'M34 32 L88 32', 'M34 68 L88 68'],
    'ㅓ': ['M12 50 L62 50', 'M62 4 L62 96'],
    'ㅕ': ['M12 32 L64 32', 'M12 68 L64 68', 'M64 4 L64 96'],
    'ㅣ': ['M50 4 L50 96'],
    'ㅐ': ['M24 4 L24 96', 'M24 50 L58 50', 'M66 4 L66 96'],
    'ㅒ': ['M20 4 L20 96', 'M20 32 L54 32', 'M20 68 L54 68', 'M64 4 L64 96'],
    'ㅔ': ['M8 50 L40 50', 'M40 4 L40 96', 'M72 4 L72 96'],
    'ㅖ': ['M8 32 L38 32', 'M8 68 L38 68', 'M38 4 L38 96', 'M72 4 L72 96'],
    'ㅗ': ['M50 14 L50 58', 'M6 62 L94 62'],
    'ㅛ': ['M30 18 L30 60', 'M70 18 L70 60', 'M6 64 L94 64'],
    'ㅜ': ['M6 38 L94 38', 'M50 38 L50 84'],
    'ㅠ': ['M6 34 L94 34', 'M30 34 L30 80', 'M70 34 L70 80'],
    'ㅡ': ['M6 50 L94 50'],
    'ㅘ': ['M30 28 L30 60', 'M6 64 L56 64', 'M72 4 L72 96', 'M72 50 L94 50'],
    'ㅙ': ['M22 28 L22 60', 'M4 64 L42 64', 'M54 4 L54 96', 'M54 50 L74 50', 'M84 4 L84 96'],
    'ㅚ': ['M34 28 L34 60', 'M8 64 L62 64', 'M82 4 L82 96'],
    'ㅝ': ['M6 34 L56 34', 'M30 34 L30 80', 'M60 50 L80 50', 'M80 4 L80 96'],
    'ㅞ': ['M4 34 L44 34', 'M24 34 L24 80', 'M48 50 L62 50', 'M62 4 L62 96', 'M86 4 L86 96'],
    'ㅟ': ['M6 34 L62 34', 'M34 34 L34 80', 'M82 4 L82 96'],
    'ㅢ': ['M6 56 L66 56', 'M84 4 L84 96'],
  };

  // 획 재사용 판정용: 자모를 구성하는 기본 단위 (IME 조합 순서와 일치)
  const U = {};
  for (const k of Object.keys(S)) U[k] = [k];
  Object.assign(U, {
    'ㅐ': ['ㅏ', 'ㅣ'], 'ㅒ': ['ㅑ', 'ㅣ'], 'ㅔ': ['ㅓ', 'ㅣ'], 'ㅖ': ['ㅕ', 'ㅣ'],
    'ㅘ': ['ㅗ', 'ㅏ'], 'ㅙ': ['ㅗ', 'ㅏ', 'ㅣ'], 'ㅚ': ['ㅗ', 'ㅣ'],
    'ㅝ': ['ㅜ', 'ㅓ'], 'ㅞ': ['ㅜ', 'ㅓ', 'ㅣ'], 'ㅟ': ['ㅜ', 'ㅣ'], 'ㅢ': ['ㅡ', 'ㅣ'],
  });

  // 쌍자음·겹받침: 기본 자음 둘을 좌우 절반에 나란히
  function mapX(d, f) {
    let i = 0;
    return d.replace(numRe, m => { const v = +m; return (i++ % 2 === 0 ? f(v) : v).toFixed(1); });
  }
  function pair(a, b) {
    const l = S[a].map(d => mapX(d, x => x * .44 + 3));
    const r = S[b].map(d => mapX(d, x => x * .44 + 53));
    return [...l, ...r];
  }
  const PAIRS = {
    'ㄲ': 'ㄱㄱ', 'ㄸ': 'ㄷㄷ', 'ㅃ': 'ㅂㅂ', 'ㅆ': 'ㅅㅅ', 'ㅉ': 'ㅈㅈ',
    'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ', 'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ', 'ㄼ': 'ㄹㅂ',
    'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ', 'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ',
  };
  for (const [k, v] of Object.entries(PAIRS)) { S[k] = pair(v[0], v[1]); U[k] = [v[0], v[1]]; }

  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
  const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
  const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ',
                'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const JUNG_SET = new Set(JUNG);
  const VERT = new Set('ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.split(''));
  const HORZ = new Set('ㅗㅛㅜㅠㅡ'.split(''));

  // 자모가 글자 칸(0~100) 안에서 차지하는 영역 [x0,y0,x1,y1]
  const R0 = {
    V: { cho: [6, 10, 50, 90], jung: [54, 4, 94, 96] },
    H: { cho: [16, 6, 84, 46], jung: [6, 50, 94, 94] },
    M: { cho: [14, 6, 62, 48], jung: [4, 44, 96, 96] },
  };
  const JB = [16, 66, 84, 96];
  const R1 = {
    V: { cho: [6, 6, 48, 60], jung: [52, 2, 94, 64], jong: JB },
    H: { cho: [18, 4, 82, 32], jung: [6, 34, 94, 64], jong: JB },
    M: { cho: [12, 4, 58, 32], jung: [4, 30, 96, 64], jong: JB },
  };
  function rectsFor(p) {
    if (!p.jung) return { cho: [16, 10, 84, 90] };
    if (!p.cho) return { jung: [10, 6, 90, 94] };
    const t = VERT.has(p.jung) ? 'V' : HORZ.has(p.jung) ? 'H' : 'M';
    return (p.jong ? R1 : R0)[t];
  }

  function decompose(ch) {
    const c = ch.codePointAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) {
      const i = c - 0xAC00;
      return { cho: CHO[(i / 588) | 0], jung: JUNG[((i % 588) / 28) | 0], jong: JONG[i % 28] || null };
    }
    if (c >= 0x3131 && c <= 0x3163 && S[ch]) return JUNG_SET.has(ch) ? { jung: ch } : { cho: ch };
    return null;
  }
  function keepCount(a, b) {
    let n = 0;
    const ua = U[a], ub = U[b];
    for (let i = 0; i < Math.min(ua.length, ub.length); i++) {
      if (ua[i] !== ub[i]) break;
      n += S[ua[i]].length;
    }
    return n;
  }
  function advance(ch) {
    if (ch === '\n') return 0;
    if (ch === ' ') return 22;
    if (isEmoji(ch)) return 46;
    return ch.codePointAt(0) >= 0x2E80 ? 50 : 28;
  }

  // ───────── DOM ─────────
  const $ = id => document.getElementById(id);
  const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const paper = $('paper'), board = $('board'), glyphs = $('glyphs'), rules = $('rules');
  const pad = $('pad'), stats = $('stats');
  const pencil = $('penTool'), pshadow = $('pshadow');
  const eraser = $('eraserTool'), eshadow = $('eshadow');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ───────── 연필 소리: 선을 긋는 동안만 지속적으로 사각거림 ─────────
  let actx = null, nGain, nBand, noiseBuf = null, soundOn = store.get('sound') !== 'off';
  function audioInit() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    noiseBuf = buf;
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    nBand = actx.createBiquadFilter(); nBand.type = 'bandpass'; nBand.frequency.value = 1800; nBand.Q.value = 0.8;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    nGain = actx.createGain(); nGain.gain.value = 0;
    src.connect(nBand).connect(hp).connect(nGain).connect(actx.destination);
    src.start();
  }
  function penSound(active, intensity = 1, low = false) {
    if (!actx || !nGain) return;
    const t = actx.currentTime;
    const g = (active && soundOn) ? (0.05 + Math.random() * 0.05) * intensity : 0;
    nGain.gain.setTargetAtTime(g, t, 0.015);
    const f = low ? 500 + Math.random() * 600 : 1100 + Math.random() * 1500;
    if (active) nBand.frequency.setTargetAtTime(f, t, 0.02);
  }

  // 연필을 끈 상태: 키를 칠 때마다 짧게 사각거린다
  function tick(kind) {
    if (!actx || !soundOn || !noiseBuf) return;
    const now = actx.currentTime;
    const dur = kind === 'space' ? 0.14 : kind === 'erase' ? 0.11 : 0.05 + Math.random() * 0.06;
    const vol = kind === 'erase' ? 0.09 : kind === 'space' ? 0.06 : 0.1 + Math.random() * 0.05;
    const f = kind === 'erase' ? 700 : 1100 + Math.random() * 1300;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.5;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(f, now);
    bp.frequency.linearRampToValueAtTime(f * (0.7 + Math.random() * 0.6), now + dur);
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(bp).connect(hp).connect(g).connect(actx.destination);
    src.start(now, Math.random() * 0.5, dur + 0.02);
  }
  // 종이 구기는 소리: 구겨지는 단계(0, 300, 600ms)마다 바삭하게 한 번씩, 820ms에 던지는 소리, 1270ms에 닿는 소리
  function crumpleSound() {
    if (!actx || !soundOn || !noiseBuf) return;
    const now = actx.currentTime + 0.02;
    const crunch = (t, dur, vol, f) => {
      const src = actx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 0.7;
      const g = actx.createGain();
      g.gain.setValueAtTime(0, now + t);
      for (let u = 0; u < dur; u += 0.012) {          // 바삭바삭 갈라지는 짧은 스파이크들
        const spike = Math.random() < 0.35 ? 0.12 : 0.5 + Math.random() * 0.5;
        g.gain.linearRampToValueAtTime(vol * spike, now + t + u + 0.005);
        g.gain.linearRampToValueAtTime(vol * 0.06, now + t + u + 0.011);
      }
      g.gain.linearRampToValueAtTime(0, now + t + dur + 0.02);
      src.connect(bp).connect(g).connect(actx.destination);
      src.start(now + t, Math.random() * 1.5); src.stop(now + t + dur + 0.06);
    };
    crunch(0.00, 0.17, 0.26, 1150);
    crunch(0.30, 0.19, 0.30, 950);
    crunch(0.60, 0.12, 0.24, 1700);
    // 푱: 위로 스치는 소리
    const w = actx.createBufferSource();
    w.buffer = noiseBuf; w.loop = true;
    const wb = actx.createBiquadFilter(); wb.type = 'bandpass'; wb.Q.value = 1.1;
    wb.frequency.setValueAtTime(500, now + 0.82);
    wb.frequency.exponentialRampToValueAtTime(2000, now + 1.06);
    const wg = actx.createGain();
    wg.gain.setValueAtTime(0.0001, now + 0.82);
    wg.gain.linearRampToValueAtTime(0.16, now + 0.9);
    wg.gain.linearRampToValueAtTime(0.0001, now + 1.12);
    w.connect(wb).connect(wg).connect(actx.destination);
    w.start(now + 0.82); w.stop(now + 1.16);
    // 톡: 쓰레기통에 닿는 소리
    const o = actx.createOscillator(), og = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(230, now + 1.27);
    o.frequency.exponentialRampToValueAtTime(110, now + 1.37);
    og.gain.setValueAtTime(0.0001, now + 1.27);
    og.gain.linearRampToValueAtTime(0.18, now + 1.28);
    og.gain.exponentialRampToValueAtTime(0.0001, now + 1.39);
    o.connect(og).connect(actx.destination);
    o.start(now + 1.27); o.stop(now + 1.45);
  }

  // ───────── 획 / 슬롯 관리 ─────────
  const queue = [];           // 연필이 쓸 차례를 기다리는 획
  const tweens = new Set();   // 위치 보간 중인 획
  let slots = [];
  let prevChars = [];
  let clipSeq = 0;

  const nums = d => d.match(numRe).map(Number);
  const withNums = (d, a) => { let i = 0; return d.replace(numRe, () => a[i++].toFixed(1)); };
  const rnd = (a) => (Math.random() * 2 - 1) * a;

  function setStrokeD(st) {
    const d = withNums(st.tmpl, st.cur);
    st.hi.setAttribute('d', d); st.ld.setAttribute('d', d);
  }
  function setProg(st, p) {
    st.prog = p;
    const off = String(1 - p);
    st.hi.style.strokeDashoffset = off; st.ld.style.strokeDashoffset = off;
  }
  function addStroke(slot, role, d, instant) {
    const hi = el('path', { class: 'hi', pathLength: 1 });
    const ld = el('path', { class: 'lead', pathLength: 1 });
    for (const p of [hi, ld]) p.style.strokeDasharray = '1 2';
    ld.style.opacity = (0.8 + Math.random() * 0.2).toFixed(2);
    slot.g.append(hi, ld);
    const st = { kind: 'stroke', slot, role, hi, ld, tmpl: d, cur: null, jit: null, anim: null, prog: 0, dead: false, len: 0 };
    setProg(st, instant ? 1 : 0);
    if (!instant) queue.push(st);
    return st;
  }
  let batch = null;           // 삭제 입력 중 모은, 지우개로 지울 대상
  function killStroke(st) {
    st.dead = true;
    tweens.delete(st);
    if (batch && st.prog >= 1 && !st.erasing) {
      st.erasing = true;
      st.hi.classList.add('erasing'); st.ld.classList.add('erasing');
      batch.items.push({ kind: 'stroke', st });
      return;
    }
    if (!pencilOn) { st.hi.remove(); st.ld.remove(); return; }
    st.hi.parentNode && st.hi.classList.add('fade');
    st.ld.classList.add('fade');
    setTimeout(() => { st.hi.remove(); st.ld.remove(); }, 220);
  }
  function killJamo(j) { for (const st of j.strokes) killStroke(st); }
  function killText(slot) {
    if (!slot.text) return;
    const t = slot.text;
    t.dead = true;
    slot.text = null;
    if (batch && t.prog >= 1) { batch.items.push({ kind: 'text', t }); return; }
    t.group.remove();
    t.clip.remove();
  }

  function finalizeBatch(b) {
    const run = () => b.after.forEach(f => f());
    if (!b.items.length) { run(); return; }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const els = [];
    for (const it of b.items) {
      if (it.kind === 'stroke') {
        const a = it.st.cur || [];
        for (let i = 0; i < a.length; i += 2) {
          x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]);
          y0 = Math.min(y0, a[i + 1]); y1 = Math.max(y1, a[i + 1]);
        }
        els.push({ el: it.st.hi, base: 0.7 }, { el: it.st.ld, base: +it.st.ld.style.opacity || 1 });
      } else {
        const t = it.t;
        x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x + t.w);
        y0 = Math.min(y0, t.y - G * 0.8); y1 = Math.max(y1, t.y);
        els.push({ el: t.group, base: 1 });
      }
    }
    const task = { kind: 'erase', items: b.items, els, after: b.after, fast: b.fast, dead: false, prog: 0, len: 0 };
    if (b.items.length > 30 || x0 > x1) { eraseCleanup(task); return; }
    if (x1 - x0 < 28) { const c = (x0 + x1) / 2; x0 = c - 14; x1 = c + 14; }
    if (y1 - y0 < 20) { const c = (y0 + y1) / 2; y0 = c - 10; y1 = c + 10; }
    task.bb = { x0: x0 - 6, y0: y0 - 6, x1: x1 + 6, y1: y1 + 6 };
    queue.push(task);
  }
  function eraseCleanup(task) {
    for (const it of task.items) {
      if (it.kind === 'stroke') { it.st.hi.remove(); it.st.ld.remove(); }
      else { it.t.group.remove(); it.t.clip.remove(); }
    }
    task.after.forEach(f => f());
  }

  function newSlot() {
    const g = el('g');
    glyphs.append(g);
    return { g, ch: null, key: '', sig: '', parts: null, jamo: {}, text: null,
             rot: rnd(0.035), dy: rnd(1.2), ox: 0, oy: 0, row: 0 };
  }

  function setSlot(slot, ch, instant) {
    if (!slot) slot = newSlot();
    if (slot.ch === ch) return slot;
    slot.ch = ch; slot.key = ch;
    if (slot.move) { slot.move.dead = true; slot.move = null; }
    const parts = decompose(ch);

    if (!parts) {
      for (const r of Object.keys(slot.jamo)) { killJamo(slot.jamo[r]); delete slot.jamo[r]; }
      slot.parts = null;
      if (ch === ' ' || ch === '\n' || ch.trim() === '') {
        killText(slot);
        if (!instant) { slot.move = { kind: 'move', slot, dead: false }; queue.push(slot.move); }
        return slot;
      }
      killText(slot);
      const id = 'clip' + (++clipSeq);
      const clip = el('clipPath', { id });
      const rect = el('rect', { width: 0, height: G + 12 });
      clip.append(rect);
      board.querySelector('defs').append(clip);
      const group = el('g', { 'clip-path': `url(#${id})` });
      const emoji = isEmoji(ch);
      // 텍스트 모양(❤, ⚠ …)으로 나오는 기호도 항상 컬러 이모지로 통일한다
      const display = emoji && ch.length === 1 ? ch + '\uFE0F' : ch;
      const text = el('text', {
        'font-family': emoji ? EMOJI_FONT : 'Yeon Sung, cursive',
        'font-size': emoji ? 34 : 38, fill: '#34343b',
      });
      text.textContent = display;
      group.append(text);
      slot.g.append(group);
      slot.text = { kind: 'text', ch, display, emoji, group, clip, rect, node: text, x: 0, y: 0, w: advance(ch), prog: 0, dead: false };
      if (instant) rect.setAttribute('width', 200); else queue.push(slot.text);
      return slot;
    }

    killText(slot);
    slot.parts = parts;
    for (const role of ['cho', 'jung', 'jong']) {
      const id = parts[role];
      const old = slot.jamo[role];
      if (!id) { if (old) { killJamo(old); delete slot.jamo[role]; } continue; }
      if (old && old.id === id) continue;
      const defs = S[id];
      const keep = old ? Math.min(keepCount(old.id, id), defs.length, old.strokes.length) : 0;
      const strokes = old ? old.strokes.slice(0, keep) : [];
      if (old) for (const st of old.strokes.slice(keep)) killStroke(st);
      for (let i = 0; i < keep; i++) strokes[i].tmpl = defs[i];
      for (let i = keep; i < defs.length; i++) strokes.push(addStroke(slot, role, defs[i], instant));
      slot.jamo[role] = { id, strokes };
    }
    return slot;
  }
  function removeSlot(slot) {
    if (slot.move) { slot.move.dead = true; slot.move = null; }
    for (const r of Object.keys(slot.jamo)) killJamo(slot.jamo[r]);
    killText(slot);
    if (batch) { batch.after.push(() => slot.g.remove()); return; }
    if (!pencilOn) { slot.g.remove(); return; }
    slot.g.classList.add('fade');
    setTimeout(() => slot.g.remove(), 220);
  }

  // ───────── 배치 ─────────
  let rowsUsed = 1;
  function place(d, rect, slot, jit) {
    const a = nums(d), out = [];
    const [x0, y0, x1, y1] = rect, k = G / 100;
    const cx = slot.ox + G / 2, cy = slot.oy + slot.dy + G / 2;
    const c = Math.cos(slot.rot), s = Math.sin(slot.rot);
    for (let i = 0; i < a.length; i += 2) {
      const X = slot.ox + (x0 + a[i] / 100 * (x1 - x0)) * k + (jit[i] || 0);
      const Y = slot.oy + slot.dy + (y0 + a[i + 1] / 100 * (y1 - y0)) * k + (jit[i + 1] || 0);
      const dx = X - cx, dy = Y - cy;
      out.push(cx + dx * c - dy * s, cy + dx * s + dy * c);
    }
    return out;
  }

  function applyGeometry(slot, instant) {
    if (slot.parts) {
      const rects = rectsFor(slot.parts);
      for (const role of Object.keys(slot.jamo)) {
        const rect = rects[role];
        if (!rect) continue;
        for (const st of slot.jamo[role].strokes) {
          const n = nums(st.tmpl).length;
          if (!st.jit || st.jit.length !== n) st.jit = Array.from({ length: n }, () => rnd(0.9));
          const to = place(st.tmpl, rect, slot, st.jit);
          if (!st.cur || st.cur.length !== to.length || instant) {
            st.cur = to; st.anim = null; tweens.delete(st); setStrokeD(st);
          } else {
            st.anim = { from: st.cur.slice(), to, t0: performance.now(), dur: 220 };
            tweens.add(st);
          }
        }
      }
    }
    if (slot.text) {
      const t = slot.text;
      t.x = slot.ox; t.y = slot.oy + G * 0.82;
      t.node.setAttribute('x', t.x); t.node.setAttribute('y', t.y);
      t.rect.setAttribute('x', t.x - 3); t.rect.setAttribute('y', slot.oy - 8);
    }
  }

  const rowY = r => MT + r * LH + (LH - G) / 2 - 4;
  let starts = [], ends = [], endB = { row: 0, x: ML };   // 글자 칸의 왼쪽/오른쪽 경계(캐럿 후보)
  let lastRulesKey = '';
  const grainMask = $('grainMask'), grainRect = grainMask.firstElementChild;
  function sizeGrainMask(W, H) {   // 마스크는 종이 크기만큼만 (너무 크면 매 프레임 느려진다)
    for (const n of [grainMask, grainRect]) { n.setAttribute('width', Math.ceil(W)); n.setAttribute('height', Math.ceil(H)); }
  }

  function layout(instant) {
    const W = paper.clientWidth / Z;      // 확대할수록 한 줄에 들어가는 폭(단위)이 줄어든다
    const maxX = W - ML - 28;
    let x = freeMode ? anchor.x - ML : 0, row = freeMode ? anchor.row : 0;
    starts = []; ends = [];
    for (let i = 0; i < slots.length; i++) {
      const slot = slots[i];
      if (slot.ch === '\n') {
        starts[i] = { row, x: ML + x };
        slot.row = row; slot.ox = ML + x; slot.oy = rowY(row);
        x = 0; row++;
        slot.nx = ML; slot.ny = rowY(row) + G * 0.55;
        continue;
      }
      const adv = advance(slot.ch);
      if (x + adv > maxX && x > 0) { x = 0; row++; }
      starts[i] = { row, x: ML + x };
      ends[i] = { row, x: ML + x + adv };
      slot.row = row;
      slot.ox = ML + x + (adv - G) / 2;
      slot.oy = rowY(row);
      slot.nx = ML + x + adv; slot.ny = slot.oy + G * 0.55;
      // 위치·글자·배율이 그대로면 다시 계산하지 않는다 (긴 글에서도 가볍게)
      const sig = slot.ox + '|' + slot.oy + '|' + Z + '|' + slot.key;
      if (instant || slot.sig !== sig) { slot.sig = sig; applyGeometry(slot, instant); }
      x += adv;
    }
    endB = { row, x: ML + x };
    rowsUsed = row + 1;
    if (freeMode) {                       // 확정된 글자는 제자리에 고정
      for (const sl of committed) {
        const adv = advance(sl.ch);
        sl.ox = sl.fx + (adv - G) / 2; sl.oy = rowY(sl.frow); sl.row = sl.frow;
        sl.nx = sl.fx + adv; sl.ny = sl.oy + G * 0.55;
        const sig = sl.ox + '|' + sl.oy + '|' + Z + '|' + sl.key;
        if (instant || sl.sig !== sig) { sl.sig = sig; applyGeometry(sl, instant); }
        if (sl.frow + 1 > rowsUsed) rowsUsed = sl.frow + 1;
      }
    }
    const H = Math.max(rowsUsed * LH + MT + 60, (window.innerHeight - 110) / Z);
    layoutW = W; layoutH = H;
    board.setAttribute('height', H * Z);
    board.setAttribute('viewBox', `0 0 ${W} ${H}`);
    sizeGrainMask(W, H);
    drawRules(W, H);
    if (queue.length === 0 && pen.mode === 'idle' && slots.length === 0 && !freeMode) restPen();
    updateCaret();
  }

  function drawRules(W, H) {
    const key = W + 'x' + H;
    if (key === lastRulesKey) return;
    lastRulesKey = key;
    const n = Math.floor((H - MT) / LH);
    let html = '';
    for (let r = 0; r < n; r++) {
      const y = MT + r * LH + 58;
      html += `<line class="rule" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
    }
    html += `<line class="margin" x1="${ML - 26}" x2="${ML - 26}" y1="0" y2="${H}"/>`;
    rules.innerHTML = html;
  }

  // ───────── 캐럿(연필이 따라가야 할 자리) ─────────
  function caretBound(i) {
    if (i > 0 && ends[i - 1]) return ends[i - 1];
    if (i < slots.length && starts[i]) return starts[i];
    return endB;
  }
  function caretXY(i) {
    const b = caretBound(i);
    return { x: b.x, y: rowY(b.row) + G * 0.55 };
  }
  function candidates() {
    const c = [];
    starts.forEach((b, i) => { if (b) c.push({ idx: i, row: b.row, x: b.x }); });
    ends.forEach((b, i) => { if (b) c.push({ idx: i + 1, row: b.row, x: b.x }); });
    c.push({ idx: slots.length, row: endB.row, x: endB.x });
    return c;
  }
  function nearest(row, x) {
    let best = slots.length, bd = Infinity;
    for (const c of candidates()) {
      const d = Math.abs(c.row - row) * 100000 + Math.abs(c.x - x);
      if (d < bd) { bd = d; best = c.idx; }
    }
    return best;
  }

  // ───────── 입력 반영 (공통 접두/접미를 빼고 바뀐 부분만 처리) ─────────
  function sync(text, instant, isDelete, fast) {
    const animate = pencilOn && !instant;
    batch = (isDelete && animate) ? { items: [], after: [], fast: !!fast } : null;
    const nc = chars(text), oc = prevChars;
    let p = 0;
    while (p < nc.length && p < oc.length && nc[p] === oc[p]) p++;
    let s = 0;
    while (s < nc.length - p && s < oc.length - p && nc[nc.length - 1 - s] === oc[oc.length - 1 - s]) s++;

    const oldMid = slots.slice(p, oc.length - s);
    const midChars = nc.slice(p, nc.length - s);
    const bulk = !animate || midChars.length > 3;
    const newMid = midChars.map((ch, j) => setSlot(oldMid[j], ch, bulk));
    for (let j = midChars.length; j < oldMid.length; j++) removeSlot(oldMid[j]);

    slots = [...slots.slice(0, p), ...newMid, ...slots.slice(oc.length - s)];
    prevChars = nc;
    const b = batch; batch = null;
    if (b) finalizeBatch(b);
    layout(!pencilOn);
    // 지운 뒤에는 연필이 캐럿 자리로 돌아온다 (꾹 누르는 중에는 지우개가 계속 쓸고 간다)
    if (b && !b.fast) queue.push({ kind: 'move', caret: true, dead: false });
    if (!pencilOn && !instant) ensureVisible(endPos().y);   // 연필을 꺼도 화면은 따라간다
    updateStats(nc);
  }

  // ───────── 연필 ─────────
  const pen = { x: ML, y: MT + LH * 0.7, mode: 'idle', task: null, t0: 0, dur: 0,
                fx: 0, fy: 0, tx: 0, ty: 0, len: 0, lift: 0, erasing: false };
  // 연필을 "다음에 쓸 자리"로 (확대/축소·리사이즈 후, 처음 상태)
  function endPos() {
    if (freeMode) return { x: endB.x, y: rowY(endB.row) + G * 0.55 };
    return caretXY(activeCaret());
  }
  function restPen() { const p = endPos(); pen.x = p.x; pen.y = p.y; }
  const smooth = t => t * t * (3 - 2 * t);
  const lerp = (a, b, t) => a + (b - a) * t;

  function taskStart(t) {
    if (t.kind === 'move') return (t.slot && !t.caret) ? { x: t.slot.nx, y: t.slot.ny } : endPos();
    if (t.kind === 'erase') {
      return t.fast ? { x: t.bb.x1, y: (t.bb.y0 + t.bb.y1) / 2 }
                    : { x: t.bb.x0, y: t.bb.y0 + (t.bb.y1 - t.bb.y0) * 0.2 };
    }
    if (t.kind === 'text') return { x: t.x, y: t.y - 6 };
    return t.ld.getPointAtLength(0);
  }
  function taskLen(t) { return t.kind === 'text' ? t.w * 1.4 : t.ld.getTotalLength(); }
  function taskPoint(t, p) {
    if (t.kind === 'erase') {
      // 좌우로 삐꼭삐꼭 문지르며 천천히 내려간다
      const { x0, y0, x1, y1 } = t.bb;
      if (t.fast) return { x: x1 - p * (x1 - x0), y: (y0 + y1) / 2 + Math.sin(p * Math.PI * 4) * 3 };
      const u = p * (2 + Math.round((x1 - x0) / 60)) * 2;
      const tri = 1 - Math.abs((u % 2) - 1);
      return { x: x0 + tri * (x1 - x0), y: y0 + (0.2 + 0.6 * p) * (y1 - y0) };
    }
    if (t.kind === 'text') return { x: t.x + p * t.w, y: t.y - 6 };
    return t.ld.getPointAtLength(p * t.len);
  }
  function taskSet(t, p) {
    t.prog = p;
    if (t.kind === 'erase') {
      const e = smooth(Math.max(0, (p - 0.15) / 0.85));
      for (const o of t.els) o.el.style.opacity = (o.base * (1 - e)).toFixed(3);
    } else if (t.kind === 'text') t.rect.setAttribute('width', p * (t.w + 6));
    else setProg(t, p);
  }
  function isDead(t) { return t.dead; }

  function ensureVisible(y) {
    const top = paper.getBoundingClientRect().top + window.scrollY + y * Z;
    const bottom = window.scrollY + window.innerHeight - 140;
    if (top > bottom) window.scrollTo({ top: top - window.innerHeight + 200, behavior: 'smooth' });
  }

  // 애니메이션 없이 완성 상태로 만든다 (연필 끄기, 지우기 등)
  function finishTask(t) {
    if (!t || t.dead) return;
    if (t.kind === 'erase') eraseCleanup(t);
    else if (t.kind === 'text') t.rect.setAttribute('width', 400);
    else if (t.kind === 'stroke') setProg(t, 1);
  }

  let soundActive = false;
  function placeTool(node, x, y) {
    node.style.transform = `translate(${(x * Z).toFixed(1)}px,${(y * Z).toFixed(1)}px) scale(${Z})`;
  }

  function frame(now) {
    // 위치 보간
    for (const st of tweens) {
      const a = st.anim;
      if (!a) { tweens.delete(st); continue; }
      const k = Math.min(1, (now - a.t0) / a.dur), e = smooth(k);
      st.cur = a.from.map((v, i) => lerp(v, a.to[i], e));
      setStrokeD(st);
      if (k >= 1) { st.anim = null; tweens.delete(st); }
    }

    if (pencilOn) {
      if (pen.erasing && pen.mode === 'idle' && pen.eraserHideAt && now > pen.eraserHideAt && !queue.length) {
        pen.erasing = false; pen.eraserHideAt = 0;
        eraser.style.display = 'none'; pencil.style.display = '';
      }
      const speed = Math.min(6, userSpeed * (1 + Math.max(0, queue.length - 4) * 0.3));
      if (pen.mode === 'idle') {
        while (queue.length && isDead(queue[0])) queue.shift();
        if (queue.length) {
          const t = queue.shift(), s = taskStart(t);
          if (t.kind === 'erase') { pen.x = s.x; pen.y = s.y; }
          else if (pen.erasing) { pen.erasing = false; eraser.style.display = 'none'; pencil.style.display = ''; }
          pen.task = t; pen.fx = pen.x; pen.fy = pen.y; pen.tx = s.x; pen.ty = s.y;
          const dist = Math.hypot(pen.tx - pen.fx, pen.ty - pen.fy);
          pen.dur = dist < 2 ? 0 : (25 + Math.min(dist, 300) * 0.15) / speed;
          pen.t0 = now; pen.mode = 'travel';
        }
      }
      if (pen.mode === 'travel') {
        if (isDead(pen.task)) { pen.mode = 'idle'; }
        else {
          const k = pen.dur ? Math.min(1, (now - pen.t0) / pen.dur) : 1;
          pen.x = lerp(pen.fx, pen.tx, smooth(k)); pen.y = lerp(pen.fy, pen.ty, smooth(k));
          pen.lift = Math.sin(k * Math.PI);
          if (k >= 1) {
            const t = pen.task;
            pen.lift = 0;
            ensureVisible(pen.ty);
            if (t.kind === 'move') { pen.mode = 'idle'; }
            else {
              pen.mode = 'draw'; pen.t0 = now;
              if (t.kind === 'erase') {
                pen.erasing = true;
                pencil.style.display = 'none'; eraser.style.display = '';
                pen.dur = (t.fast ? 50 : 230 + t.items.length * 60) / speed;
              } else {
                pen.len = taskLen(t);
                t.len = pen.len;
                pen.dur = (45 + pen.len * 1.7) / speed;
              }
            }
          }
        }
      } else if (pen.mode === 'draw') {
        const t = pen.task;
        if (isDead(t)) { pen.mode = 'idle'; }
        else {
          const k = Math.min(1, (now - pen.t0) / pen.dur);
          taskSet(t, smooth(k));
          const pt = taskPoint(t, smooth(k));
          pen.x = pt.x; pen.y = pt.y;
          if (actx) {
            const er = t.kind === 'erase';
            penSound(true, (er ? 1.2 : 0.7) + 0.5 * Math.min(1, speed / 2), er);
            soundActive = true;
          }
          if (k >= 1) {
            taskSet(t, 1);
            pen.mode = 'idle';
            if (t.kind === 'erase') {
              eraseCleanup(t);
              pen.x = (t.bb.x0 + t.bb.x1) / 2; pen.y = (t.bb.y0 + t.bb.y1) / 2;
              pen.eraserHideAt = now + 180;   // 꾹 누르는 동안 깜빡이지 않게, 잠깐 지우개를 그대로 둔다
            }
          }
        }
      }

      if (pen.erasing) {
        placeTool(eraser, pen.x, pen.y);
        eshadow.setAttribute('transform', 'translate(7,6)');
      } else {
        placeTool(pencil, pen.x, pen.y - pen.lift * 6);
        pshadow.setAttribute('transform', `translate(${(10 + pen.lift * 6).toFixed(1)},${(8 + pen.lift * 6).toFixed(1)})`);
      }
    }

    // 선을 긋는(또는 지우는) 중이 아니면 소리는 반드시 끈다
    if (soundActive && !(pencilOn && pen.mode === 'draw')) { penSound(false); soundActive = false; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ───────── 글자 수 ─────────
  function allItems() { return freeMode ? committed.concat(slots) : slots; }
  function updateStats() {
    let n = 0, total = 0;
    for (const sl of allItems()) {
      if (!sl.ch) continue;
      total++;
      if (sl.ch.trim()) n++;
    }
    stats.textContent = `공백 제외 ${n}자 · 공백 포함 ${total}자`;
  }

  // ───────── 선택 / 캐럿 ─────────
  function u16(i) { return prevChars.slice(0, i).join('').length; }
  function cpIdx(u) { return chars(pad.value.slice(0, u)).length; }
  function activeCaret() {
    return cpIdx(pad.selectionDirection === 'backward' ? pad.selectionStart : pad.selectionEnd);
  }
  function anchorIdx() {
    return cpIdx(pad.selectionDirection === 'backward' ? pad.selectionEnd : pad.selectionStart);
  }
  function setSel(anchor, active) {
    const a = Math.min(anchor, active), b = Math.max(anchor, active);
    pad.setSelectionRange(u16(a), u16(b), active < anchor ? 'backward' : 'forward');
    onCaret();
  }

  // 연필을 끈 상태의 깜빡이는 텍스트 커서
  const caretEl = $('caret');
  function updateCaret() {
    const show = !pencilOn && document.activeElement === pad && (freeMode || pad.selectionStart === pad.selectionEnd);
    caretEl.style.display = show ? 'block' : 'none';
    if (!show) { caretEl.classList.remove('blink'); return; }
    const b = freeMode ? endB : caretBound(cpIdx(pad.selectionEnd));
    caretEl.style.transform = `translate(${(b.x * Z).toFixed(1)}px,${((rowY(b.row) + G * 0.06) * Z).toFixed(1)}px)`;
    caretEl.style.height = (G * 0.88 * Z).toFixed(1) + 'px';
    caretEl.classList.remove('blink'); void caretEl.offsetWidth; caretEl.classList.add('blink');
  }
  pad.addEventListener('focus', updateCaret);
  pad.addEventListener('blur', updateCaret);

  let selSlots = [];
  function renderSel() {
    for (const sl of selSlots) sl.g.classList.remove('sel');
    selSlots = [];
    const a = cpIdx(pad.selectionStart), b = cpIdx(pad.selectionEnd);
    for (let i = a; i < b && i < slots.length; i++) { slots[i].g.classList.add('sel'); selSlots.push(slots[i]); }
  }

  let lastSig = '';
  const sigNow = () => pad.value.length + ':' + pad.selectionStart + ':' + pad.selectionEnd;
  // 글은 그대로인데 캐럿/선택만 바뀌면 연필이 그 자리로 따라간다
  function onCaret() {
    renderSel();
    updateCaret();
    if (freeMode) return;
    const sig = sigNow();
    if (sig === lastSig) return;
    lastSig = sig;
    if (!pencilOn) return;
    for (let i = queue.length - 1; i >= 0; i--) if (queue[i].caret) queue.splice(i, 1);
    queue.push({ kind: 'move', caret: true, dead: false });
  }
  let caretTimer = 0;
  function onCaretSoon() {
    if (caretTimer) return;
    caretTimer = setTimeout(() => { caretTimer = 0; onCaret(); }, 0);
  }
  document.addEventListener('selectionchange', () => { if (document.activeElement === pad) onCaretSoon(); });
  pad.addEventListener('select', onCaretSoon);
  pad.addEventListener('keyup', onCaretSoon);

  // 마우스: 숨은 textarea의 줄바꿈은 화면과 다르므로, 화면 좌표로 직접 글자 위치를 찾는다
  function hit(ev) {
    const r = board.getBoundingClientRect();
    const x = (ev.clientX - r.left) / Z, y = (ev.clientY - r.top) / Z;
    return nearest(Math.floor((y - MT) / LH), x);
  }
  let dragging = false, dragAnchor = 0;
  pad.addEventListener('mousedown', e => e.preventDefault());   // 기본 캐럿/선택 대신 직접 처리
  pad.addEventListener('pointerdown', e => {
    audioInit();
    if (e.button !== 0) return;
    if (freeMode) {      // 종이 위 어디를 눌러도 그 자리에서 쓴다
      const r = board.getBoundingClientRect();
      pad.focus();
      moveFree(Math.max(0, Math.floor(((e.clientY - r.top) / Z - MT) / LH)), (e.clientX - r.left) / Z, e.shiftKey);
      return;
    }
    const i = hit(e);
    dragAnchor = e.shiftKey ? anchorIdx() : i;
    pad.focus();
    setSel(dragAnchor, i);
    if (e.pointerType === 'mouse') dragging = true;
  });
  window.addEventListener('pointermove', e => { if (dragging) setSel(dragAnchor, hit(e)); });
  window.addEventListener('pointerup', () => { dragging = false; });
  pad.addEventListener('dblclick', e => {
    if (freeMode) return;
    const i = hit(e), ch = prevChars, n = ch.length;
    const isW = c => c !== undefined && !/\s/.test(c);
    let a = i, b = i;
    while (a > 0 && isW(ch[a - 1])) a--;
    while (b < n && isW(ch[b])) b++;
    if (a !== b) setSel(a, b);
  });

  // 방향키/단축키: 줄 단위 동작은 화면에 보이는 줄 기준으로 직접 처리
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  function moveTo(idx, extend) { setSel(extend ? anchorIdx() : idx, idx); }
  function lineEdge(cur, toStart) {
    const row = caretBound(cur).row;
    const rowC = candidates().filter(c => c.row === row);
    if (!rowC.length) return cur;
    rowC.sort((p, q) => toStart ? (p.x - q.x || p.idx - q.idx) : (q.x - p.x || p.idx - q.idx));
    return rowC[0].idx;
  }
  // 스페이스로 구분된 한 묶음 단위
  function wordEdge(cur, dir) {
    const ch = prevChars, ws = c => /\s/.test(c);
    let i = cur;
    if (dir > 0) { while (i < ch.length && ws(ch[i])) i++; while (i < ch.length && !ws(ch[i])) i++; }
    else { while (i > 0 && ws(ch[i - 1])) i--; while (i > 0 && !ws(ch[i - 1])) i--; }
    return i;
  }
  function applyDelete(a, b) {
    pad.setRangeText('', u16(a), u16(b), 'end');
    sync(pad.value, false, true, false);
    lastSig = sigNow();
    renderSel(); updateCaret();
    store.set('text', pad.value);
    if (!pencilOn) tick('erase');
  }
  pad.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (freeMode) { freeKey(e); return; }
    const cur = activeCaret();
    const lineMod = isMac && (e.metaKey || e.ctrlKey);  // 맥: ⌘/Ctrl = 줄
    const wordMod = isMac ? e.altKey : e.ctrlKey;       // 맥: ⌥ / 윈도우: Ctrl = 한 묶음
    let idx = null;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      const up = e.key === 'ArrowUp';
      if (lineMod) idx = up ? 0 : slots.length;
      else if (!e.altKey && !e.ctrlKey && !e.metaKey) {
        const b = caretBound(cur), row = b.row + (up ? -1 : 1);
        idx = row < 0 ? 0 : row > endB.row ? slots.length : nearest(row, b.x);
      }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const left = e.key === 'ArrowLeft';
      if (lineMod) idx = lineEdge(cur, left);
      else if (wordMod) idx = wordEdge(cur, left ? -1 : 1);
    } else if ((e.key === 'Home' || e.key === 'End') && !e.ctrlKey && !e.metaKey) {
      idx = lineEdge(cur, e.key === 'Home');
    } else if (e.key === 'Backspace' && lineMod && pad.selectionStart === pad.selectionEnd) {
      const a = lineEdge(cur, true);
      if (a < cur) { e.preventDefault(); applyDelete(a, cur); }
      return;
    }
    if (idx !== null) { e.preventDefault(); moveTo(idx, e.shiftKey); }
  });

  // ───────── 입력 ─────────
  pad.addEventListener('keydown', audioInit, { once: true });
  // 선택한 글자 위에 입력(붙여넣기 포함)하면 선택이 지워지고 그 자리에서 이어진다
  pad.addEventListener('beforeinput', e => {
    if (freeMode && freeSel.length && /^insert/.test(e.inputType || '')) freeEraseSelection();
  });
  pad.addEventListener('copy', e => {
    if (freeMode && freeSel.length) { e.preventDefault(); e.clipboardData.setData('text/plain', freeText(freeSel)); }
  });
  pad.addEventListener('cut', e => {
    if (freeMode && freeSel.length) {
      e.preventDefault(); e.clipboardData.setData('text/plain', freeText(freeSel));
      freeEraseSelection();
    }
  });
  let delKey = false, delRepeat = false;
  pad.addEventListener('keydown', e => {
    if (e.key === 'Backspace' || e.key === 'Delete') { delKey = true; delRepeat = e.repeat; }
    onCaretSoon();
  });
  pad.addEventListener('keyup', () => { delKey = false; delRepeat = false; });
  pad.addEventListener('input', e => {
    audioInit();
    if (actx && actx.state === 'suspended') actx.resume();
    const isDel = delKey || (e.inputType || '').startsWith('delete');
    const fast = isDel && (delRepeat || pen.erasing || queue.some(q => q.kind === 'erase'));
    if (freeMode) {
      const v = pad.value, nl = v.indexOf('\n');
      if (nl >= 0) {      // 줄바꿈이 섞여 들어온 경우: 앞부분을 확정하고 다음 줄에서 이어 쓴다
        sync(v.slice(0, nl), false, false, false);
        const row = endB.row + 1;
        commitRun();
        anchor = { row, x: ML };
        const tail = v.slice(nl + 1).replace(/\n/g, '');
        pad.value = tail;
        if (tail) sync(tail, false, false, false);
        layout(false);
      } else sync(v, false, isDel, fast);
    } else sync(pad.value, false, isDel, fast);
    lastSig = sigNow();
    renderSel(); updateCaret();
    if (!pencilOn) {
      const t = e.inputType || '';
      tick(isDel ? 'erase' : (t === 'insertLineBreak' || e.data === ' ') ? 'space' : 'write');
    }
    persist();
  });
  window.addEventListener('resize', () => { layout(true); if (pen.mode === 'idle' && !queue.length) restPen(); });

  // ───────── 확대/축소 · 속도 ─────────
  function setZoom(i) {
    zi = Math.max(0, Math.min(ZOOMS.length - 1, i));
    Z = ZOOMS[zi];
    store.set('zoom', String(zi));
    $('zoomLabel').textContent = Math.round(Z * 100) + '%';
    layout(true);
    if (pen.mode === 'idle' && !queue.length) restPen();
  }
  $('zoomIn').addEventListener('click', () => { setZoom(zi + 1); pad.focus(); });
  $('zoomOut').addEventListener('click', () => { setZoom(zi - 1); pad.focus(); });

  function renderSpeed() { $('speedLabel').textContent = userSpeed + '×'; }
  function setSpeed(i) {
    si = Math.max(0, Math.min(SPEEDS.length - 1, i));
    userSpeed = SPEEDS[si];
    store.set('speed', String(si));
    renderSpeed();
  }
  $('speedUp').addEventListener('click', () => { setSpeed(si + 1); pad.focus(); });
  $('speedDown').addEventListener('click', () => { setSpeed(si - 1); pad.focus(); });

  // ───────── 연필 켜기/끄기 ─────────
  function setPencil(on) {
    pencilOn = on;
    store.set('pencil', on ? 'on' : 'off');
    $('pencilBtn').textContent = on ? '연필 켜짐' : '연필 꺼짐';
    if (!on) {
      const all = [pen.mode !== 'idle' ? pen.task : null, ...queue];
      queue.length = 0;
      all.forEach(finishTask);
      pen.mode = 'idle'; pen.erasing = false;
      pencil.style.display = 'none'; eraser.style.display = 'none';
    } else {
      restPen();
      pencil.style.display = ''; eraser.style.display = 'none';
    }
    updateCaret();
  }
  $('pencilBtn').addEventListener('click', () => { setPencil(!pencilOn); pad.focus(); });

  // ───────── 종이 고정 모드 ─────────
  // 글자는 (줄, x) 좌표에 고정되고 서로 밀지 않는다. 겹쳐 써도 그대로 겹친다.
  function cellOf(sl) {
    return sl.free ? { x: sl.fx, row: sl.frow } : { x: sl.ox - (advance(sl.ch) - G) / 2, row: sl.row };
  }
  // 지금 쓰던 묶음을 제자리에 확정하고 입력 버퍼를 비운다
  function commitRun() {
    if (!freeMode || !slots.length) return;
    const e = { row: endB.row, x: endB.x };
    for (const sl of slots) {
      const c = cellOf(sl);
      sl.fx = c.x; sl.frow = c.row; sl.free = true;
      if (sl.move) { sl.move.dead = true; sl.move = null; }
      committed.push(sl);
    }
    slots = []; prevChars = [];
    pad.value = '';
    anchor = e;
    layout(false);
  }
  // 읽는 순서(줄 → x) 기준 [a, b) 범위의 글자를 선택
  const posKey = (row, x) => row * 100000 + x;
  function setFreeSel(arr) {
    for (const sl of freeSel) sl.g.classList.remove('sel');
    freeSel = arr;
    for (const sl of freeSel) sl.g.classList.add('sel');
  }
  function clearFreeSel() { selAnchor = null; if (freeSel.length) setFreeSel([]); }
  function freeSelect(a, b) {
    const lo = Math.min(posKey(a.row, a.x), posKey(b.row, b.x));
    const hi = Math.max(posKey(a.row, a.x), posKey(b.row, b.x));
    setFreeSel(committed.filter(sl => {
      const k = posKey(sl.frow, sl.fx + advance(sl.ch) / 2);
      return k >= lo && k < hi;
    }));
  }

  function moveFree(row, x, extend) {
    const limit = layoutW - 28;
    x = Math.round(Math.max(8, Math.min(limit - 10, x)) / 2) * 2;
    if (extend) { if (!selAnchor) selAnchor = { row: endB.row, x: endB.x }; }
    else clearFreeSel();
    commitRun();
    anchor = { row: Math.max(0, row), x };
    if (extend) freeSelect(selAnchor, anchor);
    if (pencilOn) {
      for (let i = queue.length - 1; i >= 0; i--) if (queue[i].caret) queue.splice(i, 1);
      queue.push({ kind: 'move', caret: true, dead: false });
    }
    layout(false);
    updateCaret();
    persist();
  }

  // 글자들을 지운다 (연필이 켜져 있으면 지우개로)
  function removeGlyphs(targets, fast, newAnchor) {
    const b = pencilOn ? { items: [], after: [], fast: !!fast } : null;
    batch = b;
    for (const sl of targets) {
      const i = committed.indexOf(sl);
      if (i >= 0) committed.splice(i, 1);
      removeSlot(sl);
    }
    batch = null;
    if (b) finalizeBatch(b);
    if (newAnchor) anchor = newAnchor;
    if (pencilOn && !fast) {
      for (let i = queue.length - 1; i >= 0; i--) if (queue[i].caret) queue.splice(i, 1);
      queue.push({ kind: 'move', caret: true, dead: false });
    }
    layout(false);
    if (!pencilOn) tick('erase');
    updateStats(); updateCaret(); persist();
  }
  function freeEraseSelection(fast) {
    if (!freeSel.length) return false;
    commitRun();
    const targets = freeSel.slice();
    clearFreeSel();
    let first = targets[0];
    for (const sl of targets) if (posKey(sl.frow, sl.fx) < posKey(first.frow, first.fx)) first = sl;
    removeGlyphs(targets, fast, { row: first.frow, x: first.fx });
    return true;
  }
  // 캐럿 왼쪽(dir<0) / 오른쪽(dir>0)에 걸친 글자를 겹친 것까지 모두 지운다
  function freeErase(dir, fast, wholeLeft) {
    commitRun();
    const row = anchor.row, p = anchor.x;
    const adv = sl => advance(sl.ch);
    const covers = q => committed.filter(sl => sl.frow === row && sl.fx <= q && q < sl.fx + adv(sl));
    let targets;
    if (wholeLeft) targets = committed.filter(sl => sl.frow === row && sl.fx < p - 0.5);
    else {
      targets = covers(dir < 0 ? p - 1 : p + 1);
      if (!targets.length && dir < 0) {      // 바로 왼쪽이 비어 있으면 가장 가까운 글자를 찾는다
        let best = -Infinity;
        for (const sl of committed) {
          const r = sl.fx + adv(sl);
          if (sl.frow === row && r <= p && r > best) best = r;
        }
        if (best > -Infinity && p - best < 80) targets = covers(best - 1);
      }
    }
    if (!targets.length) { if (dir < 0) moveFree(row, p - 25); return; }
    removeGlyphs(targets, fast, { row, x: dir < 0 ? Math.min(...targets.map(sl => sl.fx)) : p });
  }
  // 캐럿 줄에서 글자 덩어리(간격 11 이하로 이어진 글자들)의 끝으로
  function clusterEdge(dir) {
    const row = endB.row, p = endB.x;
    const spans = committed.filter(sl => sl.frow === row && sl.ch.trim())
      .map(sl => [sl.fx, sl.fx + advance(sl.ch)]).sort((a, b) => a[0] - b[0]);
    const m = [];
    for (const sp of spans) {
      if (m.length && sp[0] <= m[m.length - 1][1] + 11) m[m.length - 1][1] = Math.max(m[m.length - 1][1], sp[1]);
      else m.push([sp[0], sp[1]]);
    }
    if (dir > 0) { for (const c of m) if (c[1] > p + 1) return c[1]; return layoutW; }
    for (let i = m.length - 1; i >= 0; i--) if (m[i][0] < p - 1) return m[i][0];
    return ML;
  }
  function freeKey(e) {
    const k = e.key, shift = e.shiftKey;
    const line = e.metaKey || e.ctrlKey;      // ⌘ / Ctrl: 캐럿 기준 줄 처음·끝
    const word = e.altKey;                    // ⌥ / Alt: 글자 덩어리 단위
    const rowEnd = r => committed.reduce((m, sl) => sl.frow === r ? Math.max(m, sl.fx + advance(sl.ch)) : m, ML);
    const row = endB.row, x = endB.x;
    if (line && (k === 'a' || k === 'A') && !shift) {      // 전체 선택
      e.preventDefault();
      commitRun();
      selAnchor = null;
      setFreeSel(committed.filter(sl => sl.ch.trim()));
      return;
    }
    if (k === 'ArrowLeft') { e.preventDefault(); moveFree(row, line ? ML : word ? clusterEdge(-1) : x - 25, shift); }
    else if (k === 'ArrowRight') { e.preventDefault(); moveFree(row, line ? rowEnd(row) : word ? clusterEdge(1) : x + 25, shift); }
    else if (k === 'ArrowUp') { e.preventDefault(); moveFree(row - 1, x, shift); }
    else if (k === 'ArrowDown') { e.preventDefault(); moveFree(row + 1, x, shift); }
    else if (k === 'Home') { e.preventDefault(); moveFree(row, ML, shift); }
    else if (k === 'End') { e.preventDefault(); moveFree(row, rowEnd(row), shift); }
    else if (k === 'Enter') { e.preventDefault(); moveFree(row + 1, ML); }
    else if (k === 'Backspace' || k === 'Delete') {
      if (freeSel.length) { e.preventDefault(); freeEraseSelection(e.repeat); }
      else if (k === 'Delete') { e.preventDefault(); freeErase(1, e.repeat, false); }
      else if (pad.value === '') { e.preventDefault(); freeErase(-1, e.repeat, line); }
    }
  }
  // 좌표로 흩어진 글자를 읽는 순서(위→아래, 왼쪽→오른쪽)의 글로 바꾼다
  function freeText(list) {
    const items = (list || allItems()).map((sl, i) => ({ sl, i, ...cellOf(sl) })).filter(o => o.sl.ch && o.sl.ch !== '\n');
    items.sort((a, b) => a.row - b.row || a.x - b.x || a.i - b.i);
    const lines = [];
    let curRow = 0, line = '', cur = ML;
    for (const o of items) {
      while (curRow < o.row) { lines.push(line); line = ''; cur = ML; curRow++; }
      if (o.x > cur + 11) { line += ' '.repeat(Math.round((o.x - cur) / 22)); cur = o.x; }
      line += o.sl.ch;
      cur = Math.max(cur, o.x + advance(o.sl.ch));
    }
    lines.push(line);
    return lines.map(l => l.replace(/\s+$/, '')).join('\n').replace(/^\n+/, '');
  }
  function persist() {
    store.set('mode', freeMode ? 'free' : 'memo');
    if (freeMode) {
      const items = allItems().filter(sl => sl.ch && sl.ch !== '\n').map(sl => {
        const c = cellOf(sl);
        return [sl.ch, Math.round(c.x * 10) / 10, c.row];
      });
      store.set('items', JSON.stringify(items));
    } else store.set('text', pad.value);
  }
  function setFree(on) {
    if (on === freeMode) return;
    clearFreeSel();
    for (const sl of selSlots) sl.g.classList.remove('sel');
    selSlots = [];
    if (on) {            // 메모 → 종이 고정: 지금 보이는 배치를 그대로 굳힌다
      const frozen = [];
      for (const sl of slots) {
        if (sl.ch === '\n') { sl.g.remove(); continue; }
        const c = cellOf(sl);
        sl.fx = c.x; sl.frow = c.row; sl.free = true;
        frozen.push(sl);
      }
      const e = { row: endB.row, x: endB.x };
      committed = frozen; slots = []; prevChars = [];
      pad.value = '';
      anchor = e;
      freeMode = true;
    } else {             // 종이 고정 → 메모: 읽는 순서대로 글을 이어 붙여 다시 흘려 쓴다
      commitRun();
      const text = freeText();
      queue.length = 0; tweens.clear();
      glyphs.replaceChildren();
      committed = []; slots = []; prevChars = [];
      pen.mode = 'idle'; pen.erasing = false;
      eraser.style.display = 'none'; if (pencilOn) pencil.style.display = '';
      freeMode = false;
      pad.value = text;
      sync(text, true);
      pad.setSelectionRange(pad.value.length, pad.value.length);
      lastSig = sigNow();
    }
    $('freeBtn').textContent = freeMode ? '종이 고정 켜짐' : '종이 고정 꺼짐';
    layout(true);
    restPen();
    updateStats(); updateCaret(); persist();
  }
  $('freeBtn').addEventListener('click', () => { setFree(!freeMode); pad.focus(); });

  // ───────── 이미지 만들기 / 저장 / 복사 ─────────
  const loadImg = src => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src;
  });
  // 지금 종이의 마지막 상태를 PNG로 렌더한다 (배율·모드·애니메이션 진행 상태와 무관하게)
  async function renderPng() {
    const W = layoutW;
    const H = Math.min(layoutH, Math.max((rowsUsed + 1) * LH + MT + 10, 5 * LH + MT + 10));
    let S = Math.max(1.5, 2 * Z);
    S = Math.min(S, 8000 / W, 12000 / H);                 // 캔버스 한계를 넘지 않게
    const clone = glyphs.cloneNode(true);
    clone.querySelectorAll('g[clip-path]').forEach(n => n.remove());       // 영문·이모지는 캔버스에서 따로
    clone.querySelectorAll('.fade,.erasing').forEach(n => n.remove());     // 지워지는 중인 획 제외
    clone.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
    clone.querySelectorAll('.lead,.hi').forEach(n => { n.style.strokeDashoffset = '0'; });
    const css = '.lead{fill:none;stroke:#34343b;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}' +
      '.hi{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.7;transform:translate(.9px,.9px)}' +
      '.rule{stroke:rgba(110,130,160,.38);stroke-width:1}.margin{stroke:rgba(210,110,110,.38);stroke-width:1}';
    const defs = `<pattern id="grainPat" patternUnits="userSpaceOnUse" width="128" height="128">` +
      `<image width="128" height="128" href="${grainUrl}" xlink:href="${grainUrl}"/></pattern>` +
      `<mask id="grainMask" maskUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}">` +
      `<rect width="${W}" height="${H}" fill="url(#grainPat)"/></mask>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ` +
      `width="${W * S}" height="${H * S}" viewBox="0 0 ${W} ${H}"><style>${css}</style><defs>${defs}</defs>` +
      `<g>${rules.innerHTML}</g>${new XMLSerializer().serializeToString(clone)}</svg>`;
    const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));

    const c = document.createElement('canvas');
    c.width = Math.round(W * S); c.height = Math.round(H * S);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f8f4ea'; ctx.fillRect(0, 0, c.width, c.height);
    try {
      const m = /url\(["']?(.*?)["']?\)$/.exec(getComputedStyle(paper).backgroundImage);
      if (m) {
        const noise = await loadImg(m[1].replace(/\\"/g, '"'));
        ctx.fillStyle = ctx.createPattern(noise, 'repeat'); ctx.fillRect(0, 0, c.width, c.height);
      }
    } catch {}
    ctx.drawImage(img, 0, 0, c.width, c.height);

    if (document.fonts) { try { await document.fonts.ready; } catch {} }
    for (const sl of allItems()) {
      const t = sl.text;
      if (!t) continue;
      ctx.globalAlpha = t.emoji ? 1 : 0.9;
      ctx.fillStyle = '#34343b';
      ctx.font = t.emoji ? `${34 * S}px ${EMOJI_FONT}` : `${38 * S}px "Yeon Sung", cursive`;
      ctx.fillText(t.display, t.x * S, t.y * S);
    }
    ctx.globalAlpha = 1;
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) throw new Error('이미지를 만들지 못했습니다');
    return blob;
  }
  async function savePng(btn) {
    const old = btn.textContent;
    try {
      const blob = await renderPng();
      const d = new Date(), z = n => String(n).padStart(2, '0');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `끄적끄적-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.png`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      btn.textContent = '저장됨';
    } catch (err) {
      console.error(err);
      btn.textContent = '저장 실패';
    }
    setTimeout(() => { btn.textContent = old; }, 1500);
  }
  $('save').addEventListener('click', e => { savePng(e.currentTarget); pad.focus(); });

  // ───────── 소리 / 복사 / 지우기 ─────────
  const soundBtn = $('sound');
  function renderSound() { soundBtn.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐'; }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; store.set('sound', soundOn ? 'on' : 'off'); renderSound();
    if (!soundOn) penSound(false);
    pad.focus();
  });
  // 복사: 글 / 이미지 두 가지
  const copyMenu = $('copyMenu');
  $('copy').addEventListener('click', e => { e.stopPropagation(); copyMenu.classList.toggle('open'); });
  document.addEventListener('click', () => copyMenu.classList.remove('open'));
  async function copyText(btn) {
    const old = btn.textContent, text = freeMode ? freeText() : pad.value;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    btn.textContent = '복사됨'; setTimeout(() => { btn.textContent = old; }, 1200);
  }
  async function copyImage(btn) {
    const old = btn.textContent;
    try {
      const blob = await renderPng();
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      btn.textContent = '복사됨';
    } catch (err) {
      console.error(err);
      btn.textContent = '복사 실패';
    }
    setTimeout(() => { btn.textContent = old; }, 1400);
  }
  $('copyText').addEventListener('click', e => { copyText(e.currentTarget); copyMenu.classList.remove('open'); pad.focus(); });
  $('copyImg').addEventListener('click', e => { copyImage(e.currentTarget); copyMenu.classList.remove('open'); pad.focus(); });

  // 지우기: 종이를 구겨서 쓰레기통으로 버린다
  function clearAll() {
    queue.length = 0; tweens.clear();
    glyphs.replaceChildren();                       // 이전 글씨가 잠깐이라도 남지 않게 즉시 비운다
    board.querySelectorAll('defs clipPath').forEach(c => c.remove());
    slots = []; committed = []; prevChars = []; selSlots = []; freeSel = []; selAnchor = null;
    pad.value = '';
    anchor = { row: 0, x: ML };
    pen.mode = 'idle'; pen.erasing = false;
    eraser.style.display = 'none';
    if (pencilOn) pencil.style.display = '';
    layout(true);
    restPen();
    lastSig = sigNow();
    updateStats(); updateCaret(); persist();
  }

  // 구겨진 종이 덩어리: 큰 면 몇 장이 접힌 투박한 모양 (편지지와 같은 아이보리, 명암도 아이보리 계열).
  // 네 가지 모양 중 하나를 쓰고, 좌우 반전·회전·면 배치는 매번 달라진다. 바깥 윤곽점 배열을 돌려준다.
  const BALL_PRESETS = [
    { ax: 1.0,  pts: 14, jag: 0.2,  flaps: 2, cells: 9,  pockets: 1 },
    { ax: 1.28, pts: 15, jag: 0.18, flaps: 3, cells: 8,  pockets: 1 },
    { ax: 0.88, pts: 13, jag: 0.24, flaps: 2, cells: 7,  pockets: 2 },
    { ax: 1.12, pts: 16, jag: 0.22, flaps: 3, cells: 10, pockets: 1 },
  ];
  function drawBall(cv, variant) {
    const P = BALL_PRESETS[variant % BALL_PRESETS.length];
    const W = cv.width, cx = W / 2, cy = W / 2, R = W * 0.28;
    const c = cv.getContext('2d');
    c.clearRect(0, 0, W, W);

    // 바깥 윤곽: 각진 모서리와 삐져나온 귀퉁이
    const rot = (Math.random() - 0.5) * 0.7, mirror = Math.random() < 0.5 ? -1 : 1;
    const flapAt = new Set();
    while (flapAt.size < P.flaps) flapAt.add(Math.floor(Math.random() * P.pts));
    const outline = [];
    for (let k = 0; k < P.pts; k++) {
      const a = (k / P.pts) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
      let r = R * (1 - P.jag + Math.random() * P.jag * 2);
      if (flapAt.has(k)) r = R * (1.2 + Math.random() * 0.18);
      const x = Math.cos(a) * r * P.ax * mirror, y = Math.sin(a) * r / Math.sqrt(P.ax);
      outline.push({ x: cx + x * Math.cos(rot) - y * Math.sin(rot), y: cy + x * Math.sin(rot) + y * Math.cos(rot) });
    }

    // 면: 씨앗점에서 가까운 쪽으로 나눈 큰 조각들. 면마다 밝기가 다르고 안에서 아주 약하게 기울어진다
    const seeds = Array.from({ length: P.cells }, () => {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * R * 0.95;
      return {
        x: cx + Math.cos(a) * rr * P.ax, y: cy + Math.sin(a) * rr,
        w: (Math.random() - 0.3) * R * R * 0.5, t: 0,
        gx: (Math.random() - 0.5) * 0.004, gy: (Math.random() - 0.5) * 0.004,
      };
    });
    for (const sd of seeds) {          // 빛은 왼쪽 위에서
      const bias = 0.14 * ((cx - sd.x) * 0.55 + (cy - sd.y) * 0.8) / R;
      sd.t = Math.max(0.35, Math.min(1, 0.7 + Math.random() * 0.3 + bias));
    }
    seeds.filter(sd => sd.y > cy - R * 0.1)       // 안쪽 오목한 곳은 한두 면만 살짝 어둡게
      .sort((p, q) => Math.hypot(p.x - cx, p.y - cy) - Math.hypot(q.x - cx, q.y - cy))
      .slice(0, P.pockets).forEach(sd => { sd.t = 0.42 + Math.random() * 0.1; });

    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = W;
    const tc = tmp.getContext('2d'), img = tc.createImageData(W, W), d = img.data;
    const LIGHT = [252, 249, 240], DARK = [206, 194, 170];      // 아이보리 ~ 따뜻한 베이지
    for (let y = 0; y < W; y++) {
      for (let x = 0; x < W; x++) {
        let d1 = 1e12, d2 = 1e12, i1 = 0;
        for (let i = 0; i < seeds.length; i++) {
          const dx = x - seeds[i].x, dy = y - seeds[i].y;
          const dd = dx * dx + dy * dy - seeds[i].w;
          if (dd < d1) { d2 = d1; d1 = dd; i1 = i; } else if (dd < d2) d2 = dd;
        }
        const sd = seeds[i1];
        let t = sd.t + sd.gx * (x - sd.x) + sd.gy * (y - sd.y);
        const m = (d2 - d1) / 120;                         // 면이 만나는 곳까지의 대략적인 거리(px)
        if (m < 2.2) t -= 0.1 * (1 - m / 2.2);            // 접힌 경계는 살짝만 어둡게
        t = Math.max(0, Math.min(1, t));
        const o = (y * W + x) * 4;
        d[o] = DARK[0] + (LIGHT[0] - DARK[0]) * t;
        d[o + 1] = DARK[1] + (LIGHT[1] - DARK[1]) * t;
        d[o + 2] = DARK[2] + (LIGHT[2] - DARK[2]) * t;
        d[o + 3] = 255;
      }
    }
    tc.putImageData(img, 0, 0);

    c.save();
    c.beginPath();
    outline.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
    c.closePath();
    c.clip();
    c.drawImage(tmp, 0, 0);
    c.globalCompositeOperation = 'source-atop';        // 덩어리 느낌: 오른쪽 아래를 아주 조금 어둡게
    const rg = c.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.3, cx, cy, R * 1.5);
    rg.addColorStop(0, 'rgba(125,104,70,0)'); rg.addColorStop(1, 'rgba(125,104,70,.14)');
    c.fillStyle = rg; c.fillRect(0, 0, W, W);
    c.restore();
    c.strokeStyle = 'rgba(140,118,84,.28)'; c.lineWidth = 1.2; c.lineJoin = 'miter';
    c.beginPath();
    outline.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
    c.closePath(); c.stroke();
    return outline;
  }

  // 구겨지는 중간 단계의 주름: 선이 아니라 면의 명암으로 (단계가 오를수록 면이 많고 진해진다)
  function drawWrinkles(cv, stage) {
    const W = cv.width, H = cv.height, c = cv.getContext('2d');
    const n = [4, 8, 13][stage], k = [0.55, 0.8, 1][stage];
    const seeds = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, w: (Math.random() - 0.3) * W * H * 0.012,
      t: Math.random(), gx: (Math.random() - 0.5) * 0.012, gy: (Math.random() - 0.5) * 0.012,
    }));
    const img = c.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        let best = 1e12, bi = 0;
        for (let i = 0; i < n; i++) {
          const dx = x - seeds[i].x, dy = y - seeds[i].y;
          const dd = dx * dx + dy * dy - seeds[i].w;
          if (dd < best) { best = dd; bi = i; }
        }
        const sd = seeds[bi];
        const t = Math.max(0, Math.min(1, sd.t + sd.gx * (x - sd.x) + sd.gy * (y - sd.y)));
        const o = (y * W + x) * 4;
        if (t < 0.5) { d[o] = 125; d[o + 1] = 104; d[o + 2] = 70; d[o + 3] = (0.5 - t) * 0.5 * k * 255; }     // 그늘진 면
        else { d[o] = 255; d[o + 1] = 253; d[o + 2] = 244; d[o + 3] = (t - 0.5) * 0.7 * k * 255; }            // 빛 받는 면
      }
    }
    c.putImageData(img, 0, 0);
  }

  let trashing = false;
  const clearBtn = $('clear'), ball = $('ball'), sheet = $('sheet');
  clearBtn.addEventListener('click', () => {
    if (trashing) return;
    if (!allItems().length) { clearBtn.classList.add('bump'); setTimeout(() => clearBtn.classList.remove('bump'), 400); pad.focus(); return; }
    trashing = true;
    audioInit();
    const r = paper.getBoundingClientRect(), t = clearBtn.getBoundingClientRect();
    const PW = r.width, PH = r.height;
    const oy = Math.max(150, Math.min(Math.max(150, PH - 150), window.innerHeight / 2 - r.top));   // 화면 중앙에서 구긴다
    const cx = r.left + PW / 2, cy = r.top + oy;
    const outline = drawBall(ball, Math.floor(Math.random() * BALL_PRESETS.length));   // 보이지 않는 상태로 미리 그려 둔다

    // 종이의 클립 경로가 사각형 → 이 덩어리의 윤곽으로 단계마다 뚝뚝 오그라든다
    const fin = outline.map(p => ({ x: PW / 2 + (p.x - 150), y: oy + (p.y - 150) }));
    const rect = outline.map(p => {
      const a = Math.atan2(p.y - 150, p.x - 150), dx = Math.cos(a), dy = Math.sin(a);
      const k = Math.min(Math.abs(dx) > 1e-6 ? PW / 2 / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-6 ? PH / 2 / Math.abs(dy) : 1e9);
      return { x: PW / 2 + dx * k, y: PH / 2 + dy * k };
    });
    const jit = Math.min(PW, PH) * 0.05;
    const mix = f => rect.map((p, i) => ({
      x: p.x + (fin[i].x - p.x) * f + (Math.random() - 0.5) * jit * f,
      y: p.y + (fin[i].y - p.y) * f + (Math.random() - 0.5) * jit * f,
    }));
    const poly = pts => 'polygon(' + pts.map(p => `${(p.x / PW * 100).toFixed(2)}% ${(p.y / PH * 100).toFixed(2)}%`).join(',') + ')';

    const wr = document.createElement('canvas');          // 주름(면 명암) 오버레이
    wr.className = 'wrinkle';
    wr.width = 220; wr.height = Math.max(120, Math.min(900, Math.round(220 * PH / PW)));
    paper.append(wr);
    paper.style.transformOrigin = `50% ${oy}px`;
    sheet.classList.add('shadowed');          // 구겨지는 동안에도 같은 농도의 그림자가 뒤에 있다
    paper.classList.add('crumple');
    crumpleSound();

    // 구겨지는 건 단계마다 툭툭: 꾸직(0) · 꽈직(300) · 꽉(600) → 푱(820), 날아가는 건 휙 던지듯(0.45초)
    const stages = [
      { at: 0,   f: 0.55, tf: 'scale(.74,.8) rotate(4deg) skew(-3deg,2deg)',  fl: 'brightness(.95) contrast(1.05)' },
      { at: 300, f: 0.85, tf: 'scale(.6,.64) rotate(-3deg) skew(2deg,-2deg)', fl: 'brightness(.93) contrast(1.08)' },
      { at: 600, f: 1,    tf: 'scale(.5) rotate(0deg)',                        fl: 'brightness(.92) contrast(1.1)' },
    ];
    stages.forEach((st, i) => setTimeout(() => {
      paper.style.transform = st.tf;
      paper.style.filter = st.fl;
      paper.style.clipPath = poly(st.f === 1 ? fin : mix(st.f));
      drawWrinkles(wr, Math.min(i + 1, 2));
    }, st.at));

    setTimeout(() => {                         // 푱 — 같은 윤곽의 덩어리가 쓰레기통으로 날아간다
      ball.style.left = (cx - 75) + 'px'; ball.style.top = (cy - 75) + 'px';
      ball.style.setProperty('--bx', (t.left + t.width / 2 - cx) + 'px');
      ball.style.setProperty('--by', (t.top + t.height / 2 - cy) + 'px');
      ball.style.display = 'block';
      ball.classList.remove('fly'); void ball.offsetWidth; ball.classList.add('fly');
      paper.style.visibility = 'hidden';       // 안 보이는 사이에 비우고 새 종이를 준비한다
      wr.remove();
      paper.style.transform = ''; paper.style.filter = ''; paper.style.clipPath = ''; paper.style.transformOrigin = '';
      paper.classList.remove('crumple');
      sheet.classList.remove('shadowed');
      clearAll();
    }, 820);
    setTimeout(() => {
      ball.style.display = 'none'; ball.classList.remove('fly');
      paper.style.visibility = '';
      paper.classList.add('fresh');
      clearBtn.classList.add('bump');
      setTimeout(() => {
        paper.classList.remove('fresh'); clearBtn.classList.remove('bump');
        trashing = false; pad.focus();
      }, 420);
    }, 820 + 470);
  });

  // 디버깅/테스트용
  window.__ssg = { sync, pad, pen, queue, setPencil, renderPng, drawBall };

  // ───────── 흑연 입자 텍스처 (한 번만 생성) ─────────
  (function initGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const im = g.createImageData(128, 128);
    for (let i = 0; i < 128 * 128; i++) {
      im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = 255;
      im.data[i * 4 + 3] = 85 + Math.random() * 170;
    }
    g.putImageData(im, 0, 0);
    grainUrl = c.toDataURL();
    $('grainImg').setAttribute('href', grainUrl);
  })();

  // ───────── 시작 ─────────
  renderSound();
  const ss = parseInt(store.get('speed'), 10);
  if (ss >= 0 && ss < SPEEDS.length) { si = ss; userSpeed = SPEEDS[si]; }
  renderSpeed();
  const zs = parseInt(store.get('zoom'), 10);
  if (zs >= 0 && zs < ZOOMS.length) zi = zs;
  Z = ZOOMS[zi];
  $('zoomLabel').textContent = Math.round(Z * 100) + '%';
  pencilOn = store.get('pencil') !== 'off';
  $('pencilBtn').textContent = pencilOn ? '연필 켜짐' : '연필 꺼짐';
  if (!pencilOn) { pencil.style.display = 'none'; }
  const savedMode = store.get('mode');
  let savedItems = null;
  try { savedItems = JSON.parse(store.get('items') || 'null'); } catch {}
  if (savedMode !== 'memo' && Array.isArray(savedItems)) {
    for (const it of savedItems) {              // 종이 고정: 저장된 좌표 그대로 복원
      const sl = setSlot(null, it[0], true);
      sl.fx = it[1]; sl.frow = it[2]; sl.free = true;
      committed.push(sl);
    }
    pad.value = '';
    layout(true);
  } else {
    const saved = store.get('text') || '';      // 메모 글(또는 이전 버전 글): 흘려 쓴 뒤 필요하면 종이에 고정
    freeMode = false;
    pad.value = saved;
    pad.setSelectionRange(pad.value.length, pad.value.length);
    layout(true);
    sync(saved, true);
    if (savedMode !== 'memo') setFree(true);
  }
  $('freeBtn').textContent = freeMode ? '종이 고정 켜짐' : '종이 고정 꺼짐';
  lastSig = sigNow();
  restPen();
  updateStats();
  updateCaret();
  document.fonts && document.fonts.ready.then(() => layout(true));
})();
</script>
</body>
</html>
