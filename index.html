<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끄적끄적</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #e9e2d6;
    --paper: #fbf8f1;
    --line: rgba(120, 140, 170, .28);
    --margin: rgba(210, 110, 110, .35);
    --ink: #2b2b33;
    --muted: #8a8478;
    --lh: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --desk: #1d1c1a;
      --paper: #2a2824;
      --line: rgba(160, 175, 200, .16);
      --margin: rgba(210, 120, 120, .28);
      --ink: #e8e3d6;
      --muted: #8f897c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desk);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px;
    font-family: "Nanum Pen Script", cursive;
    color: var(--ink);
  }
  .paper {
    width: 100%; max-width: 760px; flex: 1; min-height: 0;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 12px 32px rgba(0,0,0,.10);
    position: relative; overflow: hidden;
  }
  .paper::before { /* 왼쪽 여백선 */
    content: ""; position: absolute; top: 0; bottom: 0; left: 64px;
    width: 1px; background: var(--margin); pointer-events: none;
  }
  textarea {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; outline: 0; resize: none;
    background-color: transparent;
    background-image: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--line) calc(var(--lh) - 1px));
    background-size: 100% var(--lh);
    background-attachment: local;
    padding: 14px 32px 32px 84px;
    font: 30px/var(--lh) "Nanum Pen Script", cursive;
    color: var(--ink);
    caret-color: var(--ink);
  }
  textarea::placeholder { color: var(--muted); opacity: .7; }
  .bar {
    width: 100%; max-width: 760px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 4px 0; font-size: 22px; color: var(--muted);
  }
  .bar .btns { display: flex; gap: 6px; }
  button {
    font: inherit; font-size: 22px; color: var(--ink);
    background: transparent; border: 0; border-radius: 999px;
    padding: 2px 14px; cursor: pointer; opacity: .75;
  }
  button:hover { opacity: 1; background: rgba(127,127,127,.15); }
  button:focus-visible { outline: 2px solid var(--muted); }
  @media (max-width: 480px) {
    textarea { padding-left: 60px; font-size: 26px; }
    .paper::before { left: 40px; }
  }
</style>
</head>
<body>
  <div class="paper">
    <textarea id="pad" spellcheck="false" autofocus
      placeholder="여기에 천천히 적어보세요…"></textarea>
  </div>
  <div class="bar">
    <span id="count">0자</span>
    <div class="btns">
      <button id="sound" aria-pressed="true">소리 켜짐</button>
      <button id="copy">복사</button>
      <button id="clear">지우기</button>
    </div>
  </div>

<script>
(() => {
  const pad = document.getElementById('pad');
  const count = document.getElementById('count');
  const soundBtn = document.getElementById('sound');
  const copyBtn = document.getElementById('copy');
  const clearBtn = document.getElementById('clear');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ---- 연필 소리 (WebAudio로 합성: 짧은 노이즈 + 밴드패스) ----
  let ctx = null, noise = null, soundOn = store.get('sound') !== 'off';

  function setupAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * 0.5;
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }

  // kind: 'write' | 'space' | 'erase'
  function scratch(kind = 'write') {
    if (!soundOn) return;
    setupAudio();
    if (ctx.state === 'suspended') ctx.resume();

    const now = ctx.currentTime;
    const dur = kind === 'space' ? 0.16 : kind === 'erase' ? 0.12 : 0.05 + Math.random() * 0.07;
    const vol = kind === 'erase' ? 0.10 : kind === 'space' ? 0.07 : 0.12 + Math.random() * 0.06;
    const freq = kind === 'erase' ? 1800 : 2600 + Math.random() * 2600;

    const src = ctx.createBufferSource();
    src.buffer = noise;
    src.playbackRate.value = 0.8 + Math.random() * 0.5;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(freq, now);
    bp.frequency.linearRampToValueAtTime(freq * (0.7 + Math.random() * 0.6), now + dur);
    bp.Q.value = 0.9;

    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 900;

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    src.connect(bp).connect(hp).connect(g).connect(ctx.destination);
    src.start(now, Math.random() * 0.3, dur + 0.02);
  }

  // ---- 입력 처리 (한글 IME 포함해서 input 이벤트 기준) ----
  pad.addEventListener('input', (e) => {
    const t = e.inputType || '';
    if (t.startsWith('delete')) scratch('erase');
    else if (t === 'insertLineBreak' || t === 'insertParagraph' || (e.data === ' ')) scratch('space');
    else scratch('write');
    update();
  });

  function update() {
    count.textContent = pad.value.length + '자';
    store.set('text', pad.value);
  }

  // ---- 버튼 ----
  function renderSound() {
    soundBtn.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐';
    soundBtn.setAttribute('aria-pressed', soundOn);
  }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    store.set('sound', soundOn ? 'on' : 'off');
    renderSound();
    pad.focus();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(pad.value);
    } catch {
      pad.select(); document.execCommand('copy');
      pad.setSelectionRange(pad.value.length, pad.value.length);
    }
    const old = copyBtn.textContent;
    copyBtn.textContent = '복사됨';
    setTimeout(() => { copyBtn.textContent = old; }, 1200);
    pad.focus();
  });

  clearBtn.addEventListener('click', () => {
    if (pad.value && !confirm('적은 글을 모두 지울까요?')) return;
    pad.value = '';
    update();
    pad.focus();
  });

  // 새로고침해도 이어서 쓸 수 있게 브라우저에만 저장 (서버/DB 없음)
  pad.value = store.get('text') || '';
  renderSound();
  update();
})();
</script>
</body>
</html>
