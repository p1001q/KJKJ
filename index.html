<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끄적끄적</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeon+Sung&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #e6dfd2;
    --paper: #f8f4ea;
    --ink: #34343b;
    --muted: #8a8478;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--desk);
    padding: 24px 16px 96px;
    font-family: "Yeon Sung", cursive;
    color: var(--ink);
  }
  .paper {
    position: relative;
    max-width: 820px; margin: 0 auto;
    background-color: var(--paper);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .40  0 0 0 0 .30  0 0 0 .10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 34px rgba(0,0,0,.12);
  }
  #board { display: block; width: 100%; overflow: visible; }
  #tools { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; pointer-events: none; }
  .tool { position: absolute; left: 0; top: 0; overflow: visible; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  #pad {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; resize: none; font-size: 16px; cursor: text; overflow: hidden;
  }
  .lead { fill: none; stroke: var(--ink); stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; transition: opacity .18s; }
  .hi   { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: .7; transform: translate(.9px,.9px); transition: opacity .18s; }
  .fade .lead, .fade .hi { opacity: 0; }
  .erasing { transition: none !important; }
  .sel { opacity: .35; }
  .rule { stroke: rgba(110,130,160,.38); stroke-width: 1; }
  .margin { stroke: rgba(210,110,110,.38); stroke-width: 1; }
  .stats {
    position: absolute; left: 16px; bottom: 10px; z-index: 1;
    font-size: 18px; color: #c6bca6; pointer-events: none; user-select: none;
  }
  .toolbar, .side {
    position: fixed; bottom: 18px; z-index: 5;
    background: rgba(248,244,234,.97);
    box-shadow: 0 4px 16px rgba(0,0,0,.14);
    font-size: 20px; white-space: nowrap;
  }
  .toolbar {
    left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; align-items: center;
    border-radius: 999px; padding: 6px 10px; max-width: calc(100vw - 16px);
  }
  .side { right: 16px; border-radius: 18px; padding: 6px 10px; display: grid; gap: 2px; }
  .side .row { display: flex; align-items: center; gap: 2px; }
  .side .lbl { color: var(--muted); width: 2.3em; padding-left: 4px; }
  .side .val { color: var(--ink); min-width: 3.4em; text-align: center; }
  .toolbar button, .side button {
    font: inherit; color: var(--ink); background: transparent; border: 0;
    border-radius: 999px; padding: 2px 12px; cursor: pointer; opacity: .8;
  }
  .side button { padding: 0 10px; }
  .toolbar button:hover, .side button:hover { opacity: 1; background: rgba(127,127,127,.15); }
  #clear { display: flex; align-items: center; }
  #clear svg { display: block; }
  #clear.bump svg { animation: bump .4s ease; }
  @keyframes bump { 0%,100% { transform: none; } 30% { transform: scale(1.25) rotate(-8deg); } 60% { transform: scale(.95) rotate(5deg); } }
  .caret {
    position: absolute; left: 0; top: 0; width: 2px; border-radius: 1px;
    background: var(--ink); pointer-events: none; z-index: 2; display: none;
  }
  .caret.blink { animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  .paper.crumple { animation: crumple .55s cubic-bezier(.4,0,.6,1) forwards; pointer-events: none; }
  .paper.crumple::after {
    content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background:
      linear-gradient(112deg, transparent 0 18%, rgba(70,70,90,.28) 18.4%, transparent 19.4% 41%, rgba(255,255,255,.7) 41.2%, rgba(70,70,90,.22) 42.2%, transparent 43.2% 66%, rgba(70,70,90,.3) 66.3%, transparent 67.4%),
      linear-gradient(28deg, transparent 0 27%, rgba(70,70,90,.24) 27.3%, transparent 28.2% 52%, rgba(255,255,255,.65) 52.2%, rgba(70,70,90,.2) 53.2%, transparent 54% 78%, rgba(70,70,90,.26) 78.3%, transparent 79.2%),
      linear-gradient(160deg, transparent 0 35%, rgba(70,70,90,.2) 35.4%, transparent 36.4% 71%, rgba(255,255,255,.6) 71.2%, transparent 72.4%);
    animation: creases .55s ease-in forwards;
  }
  @keyframes creases { from { opacity: 0; } to { opacity: 1; } }
  @keyframes crumple {
    0%   { transform: none; filter: none;
           clip-path: polygon(100% 50%,100% 75%,100% 100%,75% 100%,50% 100%,25% 100%,0 100%,0 75%,0 50%,0 25%,0 0,25% 0,50% 0,75% 0,100% 0,100% 25%); }
    30%  { transform: scale(.8,.86) rotate(-5deg) skew(3deg,-2deg); filter: brightness(.96) contrast(1.06);
           clip-path: polygon(94% 50%,95% 71%,92% 93%,73% 96%,50% 94%,29% 97%,6% 93%,4% 73%,5% 50%,3% 28%,7% 6%,26% 4%,50% 6%,72% 3%,93% 7%,96% 27%); }
    65%  { transform: scale(calc(var(--s) * 2.4)) rotate(12deg) skew(-6deg,4deg); filter: brightness(.93) contrast(1.12);
           clip-path: polygon(88% 50%,90% 68.3%,81.5% 81.5%,67.8% 88.8%,50% 88.6%,31.5% 90.5%,18.1% 81.9%,10.6% 68%,12% 50%,10% 31.7%,18.5% 18.5%,32.5% 11.7%,50% 12.6%,68.5% 9.5%,81.9% 18.1%,88.8% 32.2%); }
    100% { transform: scale(var(--s)) rotate(26deg); filter: brightness(.9) contrast(1.18);
           clip-path: polygon(80% 50%,83.3% 63.8%,69.1% 69.1%,63% 81.4%,50% 81%,35.8% 84.2%,30.2% 69.8%,17.7% 63.4%,20% 50%,16.7% 36.2%,30.9% 30.9%,37.4% 19.5%,50% 21%,64.2% 15.8%,69.8% 30.2%,81.4% 37%); }
  }
  #ball { position: fixed; z-index: 60; width: 150px; height: 150px; display: none; pointer-events: none; filter: drop-shadow(0 6px 8px rgba(0,0,0,.25)); }
  #ball.fly { animation: ballfly .62s cubic-bezier(.5,0,.8,.6) forwards; }
  @keyframes ballfly {
    0%   { transform: translate(0,0) scale(1) rotate(0); }
    35%  { transform: translate(calc(var(--bx) * .3), calc(var(--by) * .3 - 90px)) scale(.92) rotate(150deg); }
    100% { transform: translate(var(--bx), var(--by)) scale(.16) rotate(470deg); opacity: .85; }
  }
  .paper.fresh { animation: fresh .4s ease-out; }
  @keyframes fresh { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 900px) { .side { bottom: 72px; } }
  @media (max-width: 560px) {
    .toolbar, .side { font-size: 16px; }
    .toolbar { padding: 4px 6px; }
    .toolbar button { padding: 2px 6px; }
    .stats { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="paper" id="paper">
  <svg id="board" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- 흑연 입자: 한 번만 만든 노이즈 타일을 마스크로 씌운다 (필터 연산 없음) -->
      <pattern id="grainPat" patternUnits="userSpaceOnUse" width="128" height="128">
        <image id="grainImg" width="128" height="128"/>
      </pattern>
      <mask id="grainMask" maskUnits="userSpaceOnUse" x="0" y="0" width="4000" height="30000">
        <rect width="4000" height="30000" fill="url(#grainPat)"/>
      </mask>
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    </defs>
    <g id="rules"></g>
    <g id="glyphs" mask="url(#grainMask)"></g>
  </svg>
  <div id="tools">
    <svg id="penTool" class="tool" width="1" height="1">
      <g id="pshadow" opacity=".22" filter="url(#soft)">
        <polygon points="0,0 12,-3.2 30,-5.5 176,-5.5 176,5.5 30,5.5 12,3.2" fill="#000" transform="rotate(-62)"/>
      </g>
      <g transform="rotate(-62)">
        <polygon points="0,0 12,-3.2 12,3.2" fill="#3a3a40"/>
        <polygon points="12,-3.2 32,-5.5 32,5.5 12,3.2" fill="#e8c9a0"/>
        <rect x="32" y="-5.5" width="118" height="11" fill="#e2677a"/>
        <rect x="32" y="-5.5" width="118" height="3" fill="#f08a99"/>
        <rect x="150" y="-5.5" width="12" height="11" fill="#b9b9c0"/>
        <rect x="162" y="-5.5" width="14" height="11" rx="3" fill="#f0a3ab"/>
      </g>
    </svg>
    <svg id="eraserTool" class="tool" width="1" height="1" style="display:none">
      <g id="eshadow" opacity=".22" filter="url(#soft)">
        <rect x="-22" y="-28" width="44" height="28" rx="5" fill="#000" transform="rotate(-16)"/>
      </g>
      <g transform="rotate(-16)">
        <rect x="-22" y="-28" width="44" height="28" rx="5" fill="#f7f1e6" stroke="#d3c9b6"/>
        <path d="M-22 -23 a5 5 0 0 1 5 -5 h34 a5 5 0 0 1 5 5 v13 h-44z" fill="#5f84d4"/>
      </g>
    </svg>
  </div>
  <div class="stats" id="stats"></div>
  <div class="caret" id="caret"></div>
  <textarea id="pad" spellcheck="false" autofocus aria-label="글 입력"></textarea>
</div>

<canvas id="ball" width="300" height="300"></canvas>

<div class="toolbar">
  <button id="freeBtn">종이 고정 켜짐</button>
  <button id="pencilBtn">연필 켜짐</button>
  <button id="sound">소리 켜짐</button>
  <button id="copy">복사</button>
  <button id="save">저장</button>
  <button id="clear" aria-label="종이 버리기" title="종이 버리기">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path class="lid" d="M4 7h16M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>
    </svg>
  </button>
</div>

<div class="side">
  <div class="row"><span class="lbl">확대</span><button id="zoomOut" aria-label="축소">−</button><span class="val" id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대">+</button></div>
  <div class="row"><span class="lbl">속도</span><button id="speedDown" aria-label="느리게">−</button><span class="val" id="speedLabel">1×</span><button id="speedUp" aria-label="빠르게">+</button></div>
</div>

<script>
(() => {
  // ───────── 레이아웃 상수 ─────────
  const G = 46;          // 글자 칸 크기
  const LH = 64;         // 줄 간격
  const ML = 84;         // 왼쪽 여백
  const MT = 10;         // 위쪽 여백
  const NS = 'http://www.w3.org/2000/svg';
  const numRe = /-?\d*\.?\d+/g;
  const ZOOMS = [0.5, 0.65, 0.8, 1, 1.25, 1.5, 1.8];
  let zi = 3, Z = 1;
  const SPEEDS = [0.5, 0.75, 1, 1.5, 2, 3];
  let si = 2, userSpeed = 1;
  let pencilOn = true;
  let freeMode = true;                 // 종이 고정 모드
  let committed = [];                  // 종이 고정: 확정된 글자들 (좌표 고정)
  let anchor = { row: 0, x: ML };      // 종이 고정: 지금 쓰고 있는 자리
  let layoutW = 0, layoutH = 0;

  // ───────── 획 데이터 (0~100 상자, 획순대로) ─────────
  const S = {
    'ㄱ': ['M12 14 L88 14 L88 90'],
    'ㄴ': ['M14 10 L14 86 L90 86'],
    'ㄷ': ['M12 14 L88 14', 'M12 14 L12 86 L88 86'],
    'ㄹ': ['M12 12 L88 12 L88 46 L12 46', 'M12 46 L12 88 L88 88'],
    'ㅁ': ['M14 12 L14 88', 'M14 12 L86 12 L86 88', 'M14 88 L86 88'],
    'ㅂ': ['M18 10 L18 90', 'M82 10 L82 90', 'M18 50 L82 50', 'M18 90 L82 90'],
    'ㅅ': ['M50 12 C 46 44 30 70 10 90', 'M38 42 C 54 62 72 78 90 90'],
    'ㅇ': ['M50 10 C 74 10 90 28 90 50 C 90 72 74 90 50 90 C 26 90 10 72 10 50 C 10 28 26 10 50 10'],
    'ㅈ': ['M12 14 L88 14', 'M52 14 C 46 46 30 72 10 90', 'M42 46 C 56 66 74 80 90 90'],
    'ㅊ': ['M34 6 L66 6', 'M12 26 L88 26', 'M52 26 C 46 54 30 76 10 92', 'M42 54 C 56 72 74 84 90 92'],
    'ㅋ': ['M12 12 L88 12 L88 88', 'M12 50 L88 50'],
    'ㅌ': ['M88 12 L12 12 L12 88 L88 88', 'M12 50 L78 50'],
    'ㅍ': ['M10 12 L90 12', 'M32 12 L32 88', 'M68 12 L68 88', 'M10 88 L90 88'],
    'ㅎ': ['M34 8 L66 8', 'M14 26 L86 26',
          'M50 38 C 66 38 74 50 74 60 C 74 74 64 84 50 84 C 36 84 26 74 26 60 C 26 50 34 38 50 38'],

    'ㅏ': ['M36 4 L36 96', 'M36 50 L88 50'],
    'ㅑ': ['M34 4 L34 96', 'M34 32 L88 32', 'M34 68 L88 68'],
    'ㅓ': ['M12 50 L62 50', 'M62 4 L62 96'],
    'ㅕ': ['M12 32 L64 32', 'M12 68 L64 68', 'M64 4 L64 96'],
    'ㅣ': ['M50 4 L50 96'],
    'ㅐ': ['M24 4 L24 96', 'M24 50 L58 50', 'M66 4 L66 96'],
    'ㅒ': ['M20 4 L20 96', 'M20 32 L54 32', 'M20 68 L54 68', 'M64 4 L64 96'],
    'ㅔ': ['M8 50 L40 50', 'M40 4 L40 96', 'M72 4 L72 96'],
    'ㅖ': ['M8 32 L38 32', 'M8 68 L38 68', 'M38 4 L38 96', 'M72 4 L72 96'],
    'ㅗ': ['M50 14 L50 58', 'M6 62 L94 62'],
    'ㅛ': ['M30 18 L30 60', 'M70 18 L70 60', 'M6 64 L94 64'],
    'ㅜ': ['M6 38 L94 38', 'M50 38 L50 84'],
    'ㅠ': ['M6 34 L94 34', 'M30 34 L30 80', 'M70 34 L70 80'],
    'ㅡ': ['M6 50 L94 50'],
    'ㅘ': ['M30 28 L30 60', 'M6 64 L56 64', 'M72 4 L72 96', 'M72 50 L94 50'],
    'ㅙ': ['M22 28 L22 60', 'M4 64 L42 64', 'M54 4 L54 96', 'M54 50 L74 50', 'M84 4 L84 96'],
    'ㅚ': ['M34 28 L34 60', 'M8 64 L62 64', 'M82 4 L82 96'],
    'ㅝ': ['M6 34 L56 34', 'M30 34 L30 80', 'M60 50 L80 50', 'M80 4 L80 96'],
    'ㅞ': ['M4 34 L44 34', 'M24 34 L24 80', 'M48 50 L62 50', 'M62 4 L62 96', 'M86 4 L86 96'],
    'ㅟ': ['M6 34 L62 34', 'M34 34 L34 80', 'M82 4 L82 96'],
    'ㅢ': ['M6 56 L66 56', 'M84 4 L84 96'],
  };

  // 획 재사용 판정용: 자모를 구성하는 기본 단위 (IME 조합 순서와 일치)
  const U = {};
  for (const k of Object.keys(S)) U[k] = [k];
  Object.assign(U, {
    'ㅐ': ['ㅏ', 'ㅣ'], 'ㅒ': ['ㅑ', 'ㅣ'], 'ㅔ': ['ㅓ', 'ㅣ'], 'ㅖ': ['ㅕ', 'ㅣ'],
    'ㅘ': ['ㅗ', 'ㅏ'], 'ㅙ': ['ㅗ', 'ㅏ', 'ㅣ'], 'ㅚ': ['ㅗ', 'ㅣ'],
    'ㅝ': ['ㅜ', 'ㅓ'], 'ㅞ': ['ㅜ', 'ㅓ', 'ㅣ'], 'ㅟ': ['ㅜ', 'ㅣ'], 'ㅢ': ['ㅡ', 'ㅣ'],
  });

  // 쌍자음·겹받침: 기본 자음 둘을 좌우 절반에 나란히
  function mapX(d, f) {
    let i = 0;
    return d.replace(numRe, m => { const v = +m; return (i++ % 2 === 0 ? f(v) : v).toFixed(1); });
  }
  function pair(a, b) {
    const l = S[a].map(d => mapX(d, x => x * .44 + 3));
    const r = S[b].map(d => mapX(d, x => x * .44 + 53));
    return [...l, ...r];
  }
  const PAIRS = {
    'ㄲ': 'ㄱㄱ', 'ㄸ': 'ㄷㄷ', 'ㅃ': 'ㅂㅂ', 'ㅆ': 'ㅅㅅ', 'ㅉ': 'ㅈㅈ',
    'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ', 'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ', 'ㄼ': 'ㄹㅂ',
    'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ', 'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ',
  };
  for (const [k, v] of Object.entries(PAIRS)) { S[k] = pair(v[0], v[1]); U[k] = [v[0], v[1]]; }

  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
  const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
  const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ',
                'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
  const JUNG_SET = new Set(JUNG);
  const VERT = new Set('ㅏㅐㅑㅒㅓㅔㅕㅖㅣ'.split(''));
  const HORZ = new Set('ㅗㅛㅜㅠㅡ'.split(''));

  // 자모가 글자 칸(0~100) 안에서 차지하는 영역 [x0,y0,x1,y1]
  const R0 = {
    V: { cho: [6, 10, 50, 90], jung: [54, 4, 94, 96] },
    H: { cho: [16, 6, 84, 46], jung: [6, 50, 94, 94] },
    M: { cho: [14, 6, 62, 48], jung: [4, 44, 96, 96] },
  };
  const JB = [16, 66, 84, 96];
  const R1 = {
    V: { cho: [6, 6, 48, 60], jung: [52, 2, 94, 64], jong: JB },
    H: { cho: [18, 4, 82, 32], jung: [6, 34, 94, 64], jong: JB },
    M: { cho: [12, 4, 58, 32], jung: [4, 30, 96, 64], jong: JB },
  };
  function rectsFor(p) {
    if (!p.jung) return { cho: [16, 10, 84, 90] };
    if (!p.cho) return { jung: [10, 6, 90, 94] };
    const t = VERT.has(p.jung) ? 'V' : HORZ.has(p.jung) ? 'H' : 'M';
    return (p.jong ? R1 : R0)[t];
  }

  function decompose(ch) {
    const c = ch.codePointAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) {
      const i = c - 0xAC00;
      return { cho: CHO[(i / 588) | 0], jung: JUNG[((i % 588) / 28) | 0], jong: JONG[i % 28] || null };
    }
    if (c >= 0x3131 && c <= 0x3163 && S[ch]) return JUNG_SET.has(ch) ? { jung: ch } : { cho: ch };
    return null;
  }
  function keepCount(a, b) {
    let n = 0;
    const ua = U[a], ub = U[b];
    for (let i = 0; i < Math.min(ua.length, ub.length); i++) {
      if (ua[i] !== ub[i]) break;
      n += S[ua[i]].length;
    }
    return n;
  }
  function advance(ch) {
    if (ch === '\n') return 0;
    if (ch === ' ') return 22;
    return ch.codePointAt(0) >= 0x2E80 ? 50 : 28;
  }

  // ───────── DOM ─────────
  const $ = id => document.getElementById(id);
  const el = (n, a = {}) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const paper = $('paper'), board = $('board'), glyphs = $('glyphs'), rules = $('rules');
  const pad = $('pad'), stats = $('stats');
  const pencil = $('penTool'), pshadow = $('pshadow');
  const eraser = $('eraserTool'), eshadow = $('eshadow');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ───────── 연필 소리: 선을 긋는 동안만 지속적으로 사각거림 ─────────
  let actx = null, nGain, nBand, noiseBuf = null, soundOn = store.get('sound') !== 'off';
  function audioInit() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    noiseBuf = buf;
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    nBand = actx.createBiquadFilter(); nBand.type = 'bandpass'; nBand.frequency.value = 1800; nBand.Q.value = 0.8;
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    nGain = actx.createGain(); nGain.gain.value = 0;
    src.connect(nBand).connect(hp).connect(nGain).connect(actx.destination);
    src.start();
  }
  function penSound(active, intensity = 1, low = false) {
    if (!actx || !nGain) return;
    const t = actx.currentTime;
    const g = (active && soundOn) ? (0.05 + Math.random() * 0.05) * intensity : 0;
    nGain.gain.setTargetAtTime(g, t, 0.015);
    const f = low ? 500 + Math.random() * 600 : 1100 + Math.random() * 1500;
    if (active) nBand.frequency.setTargetAtTime(f, t, 0.02);
  }

  // 연필을 끈 상태: 키를 칠 때마다 짧게 사각거린다
  function tick(kind) {
    if (!actx || !soundOn || !noiseBuf) return;
    const now = actx.currentTime;
    const dur = kind === 'space' ? 0.14 : kind === 'erase' ? 0.11 : 0.05 + Math.random() * 0.06;
    const vol = kind === 'erase' ? 0.09 : kind === 'space' ? 0.06 : 0.1 + Math.random() * 0.05;
    const f = kind === 'erase' ? 700 : 1100 + Math.random() * 1300;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf; src.playbackRate.value = 0.8 + Math.random() * 0.5;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
    bp.frequency.setValueAtTime(f, now);
    bp.frequency.linearRampToValueAtTime(f * (0.7 + Math.random() * 0.6), now + dur);
    const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + dur * 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    src.connect(bp).connect(hp).connect(g).connect(actx.destination);
    src.start(now, Math.random() * 0.5, dur + 0.02);
  }
  // 종이 구기는 소리
  function crumpleSound() {
    if (!actx || !soundOn || !noiseBuf) return;
    const now = actx.currentTime, dur = 0.72;
    const src = actx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.5;
    const g = actx.createGain();
    g.gain.setValueAtTime(0, now);
    for (let t = 0.03; t < dur; t += 0.03) {
      const loud = Math.random() < 0.35 ? 0.02 : 0.08 + Math.random() * 0.14;
      g.gain.linearRampToValueAtTime(loud * (1 - t / dur * 0.5), now + t);
    }
    g.gain.linearRampToValueAtTime(0, now + dur + 0.04);
    src.connect(bp).connect(g).connect(actx.destination);
    src.start(now); src.stop(now + dur + 0.06);
  }

  // ───────── 획 / 슬롯 관리 ─────────
  const queue = [];           // 연필이 쓸 차례를 기다리는 획
  const tweens = new Set();   // 위치 보간 중인 획
  let slots = [];
  let prevChars = [];
  let clipSeq = 0;

  const nums = d => d.match(numRe).map(Number);
  const withNums = (d, a) => { let i = 0; return d.replace(numRe, () => a[i++].toFixed(1)); };
  const rnd = (a) => (Math.random() * 2 - 1) * a;

  function setStrokeD(st) {
    const d = withNums(st.tmpl, st.cur);
    st.hi.setAttribute('d', d); st.ld.setAttribute('d', d);
  }
  function setProg(st, p) {
    st.prog = p;
    const off = String(1 - p);
    st.hi.style.strokeDashoffset = off; st.ld.style.strokeDashoffset = off;
  }
  function addStroke(slot, role, d, instant) {
    const hi = el('path', { class: 'hi', pathLength: 1 });
    const ld = el('path', { class: 'lead', pathLength: 1 });
    for (const p of [hi, ld]) p.style.strokeDasharray = '1 2';
    ld.style.opacity = (0.8 + Math.random() * 0.2).toFixed(2);
    slot.g.append(hi, ld);
    const st = { kind: 'stroke', slot, role, hi, ld, tmpl: d, cur: null, jit: null, anim: null, prog: 0, dead: false, len: 0 };
    setProg(st, instant ? 1 : 0);
    if (!instant) queue.push(st);
    return st;
  }
  let batch = null;           // 삭제 입력 중 모은, 지우개로 지울 대상
  function killStroke(st) {
    st.dead = true;
    tweens.delete(st);
    if (batch && st.prog >= 1 && !st.erasing) {
      st.erasing = true;
      st.hi.classList.add('erasing'); st.ld.classList.add('erasing');
      batch.items.push({ kind: 'stroke', st });
      return;
    }
    if (!pencilOn) { st.hi.remove(); st.ld.remove(); return; }
    st.hi.parentNode && st.hi.classList.add('fade');
    st.ld.classList.add('fade');
    setTimeout(() => { st.hi.remove(); st.ld.remove(); }, 220);
  }
  function killJamo(j) { for (const st of j.strokes) killStroke(st); }
  function killText(slot) {
    if (!slot.text) return;
    const t = slot.text;
    t.dead = true;
    slot.text = null;
    if (batch && t.prog >= 1) { batch.items.push({ kind: 'text', t }); return; }
    t.group.remove();
    t.clip.remove();
  }

  function finalizeBatch(b) {
    const run = () => b.after.forEach(f => f());
    if (!b.items.length) { run(); return; }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    const els = [];
    for (const it of b.items) {
      if (it.kind === 'stroke') {
        const a = it.st.cur || [];
        for (let i = 0; i < a.length; i += 2) {
          x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]);
          y0 = Math.min(y0, a[i + 1]); y1 = Math.max(y1, a[i + 1]);
        }
        els.push({ el: it.st.hi, base: 0.7 }, { el: it.st.ld, base: +it.st.ld.style.opacity || 1 });
      } else {
        const t = it.t;
        x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x + t.w);
        y0 = Math.min(y0, t.y - G * 0.8); y1 = Math.max(y1, t.y);
        els.push({ el: t.group, base: 1 });
      }
    }
    const task = { kind: 'erase', items: b.items, els, after: b.after, fast: b.fast, dead: false, prog: 0, len: 0 };
    if (b.items.length > 30 || x0 > x1) { eraseCleanup(task); return; }
    if (x1 - x0 < 28) { const c = (x0 + x1) / 2; x0 = c - 14; x1 = c + 14; }
    if (y1 - y0 < 20) { const c = (y0 + y1) / 2; y0 = c - 10; y1 = c + 10; }
    task.bb = { x0: x0 - 6, y0: y0 - 6, x1: x1 + 6, y1: y1 + 6 };
    queue.push(task);
  }
  function eraseCleanup(task) {
    for (const it of task.items) {
      if (it.kind === 'stroke') { it.st.hi.remove(); it.st.ld.remove(); }
      else { it.t.group.remove(); it.t.clip.remove(); }
    }
    task.after.forEach(f => f());
  }

  function newSlot() {
    const g = el('g');
    glyphs.append(g);
    return { g, ch: null, key: '', sig: '', parts: null, jamo: {}, text: null,
             rot: rnd(0.035), dy: rnd(1.2), ox: 0, oy: 0, row: 0 };
  }

  function setSlot(slot, ch, instant) {
    if (!slot) slot = newSlot();
    if (slot.ch === ch) return slot;
    slot.ch = ch; slot.key = ch;
    if (slot.move) { slot.move.dead = true; slot.move = null; }
    const parts = decompose(ch);

    if (!parts) {
      for (const r of Object.keys(slot.jamo)) { killJamo(slot.jamo[r]); delete slot.jamo[r]; }
      slot.parts = null;
      if (ch === ' ' || ch === '\n' || ch.trim() === '') {
        killText(slot);
        if (!instant) { slot.move = { kind: 'move', slot, dead: false }; queue.push(slot.move); }
        return slot;
      }
      killText(slot);
      const id = 'clip' + (++clipSeq);
      const clip = el('clipPath', { id });
      const rect = el('rect', { width: 0, height: G + 12 });
      clip.append(rect);
      board.querySelector('defs').append(clip);
      const group = el('g', { 'clip-path': `url(#${id})` });
      const text = el('text', { 'font-family': 'Yeon Sung, cursive', 'font-size': 38, fill: '#34343b' });
      text.textContent = ch;
      group.append(text);
      slot.g.append(group);
      slot.text = { kind: 'text', ch, group, clip, rect, node: text, x: 0, y: 0, w: advance(ch), prog: 0, dead: false };
      if (instant) rect.setAttribute('width', 200); else queue.push(slot.text);
      return slot;
    }

    killText(slot);
    slot.parts = parts;
    for (const role of ['cho', 'jung', 'jong']) {
      const id = parts[role];
      const old = slot.jamo[role];
      if (!id) { if (old) { killJamo(old); delete slot.jamo[role]; } continue; }
      if (old && old.id === id) continue;
      const defs = S[id];
      const keep = old ? Math.min(keepCount(old.id, id), defs.length, old.strokes.length) : 0;
      const strokes = old ? old.strokes.slice(0, keep) : [];
      if (old) for (const st of old.strokes.slice(keep)) killStroke(st);
      for (let i = 0; i < keep; i++) strokes[i].tmpl = defs[i];
      for (let i = keep; i < defs.length; i++) strokes.push(addStroke(slot, role, defs[i], instant));
      slot.jamo[role] = { id, strokes };
    }
    return slot;
  }
  function removeSlot(slot) {
    if (slot.move) { slot.move.dead = true; slot.move = null; }
    for (const r of Object.keys(slot.jamo)) killJamo(slot.jamo[r]);
    killText(slot);
    if (batch) { batch.after.push(() => slot.g.remove()); return; }
    if (!pencilOn) { slot.g.remove(); return; }
    slot.g.classList.add('fade');
    setTimeout(() => slot.g.remove(), 220);
  }

  // ───────── 배치 ─────────
  let rowsUsed = 1;
  function place(d, rect, slot, jit) {
    const a = nums(d), out = [];
    const [x0, y0, x1, y1] = rect, k = G / 100;
    const cx = slot.ox + G / 2, cy = slot.oy + slot.dy + G / 2;
    const c = Math.cos(slot.rot), s = Math.sin(slot.rot);
    for (let i = 0; i < a.length; i += 2) {
      const X = slot.ox + (x0 + a[i] / 100 * (x1 - x0)) * k + (jit[i] || 0);
      const Y = slot.oy + slot.dy + (y0 + a[i + 1] / 100 * (y1 - y0)) * k + (jit[i + 1] || 0);
      const dx = X - cx, dy = Y - cy;
      out.push(cx + dx * c - dy * s, cy + dx * s + dy * c);
    }
    return out;
  }

  function applyGeometry(slot, instant) {
    if (slot.parts) {
      const rects = rectsFor(slot.parts);
      for (const role of Object.keys(slot.jamo)) {
        const rect = rects[role];
        if (!rect) continue;
        for (const st of slot.jamo[role].strokes) {
          const n = nums(st.tmpl).length;
          if (!st.jit || st.jit.length !== n) st.jit = Array.from({ length: n }, () => rnd(0.9));
          const to = place(st.tmpl, rect, slot, st.jit);
          if (!st.cur || st.cur.length !== to.length || instant) {
            st.cur = to; st.anim = null; tweens.delete(st); setStrokeD(st);
          } else {
            st.anim = { from: st.cur.slice(), to, t0: performance.now(), dur: 220 };
            tweens.add(st);
          }
        }
      }
    }
    if (slot.text) {
      const t = slot.text;
      t.x = slot.ox; t.y = slot.oy + G * 0.82;
      t.node.setAttribute('x', t.x); t.node.setAttribute('y', t.y);
      t.rect.setAttribute('x', t.x - 3); t.rect.setAttribute('y', slot.oy - 8);
    }
  }

  const rowY = r => MT + r * LH + (LH - G) / 2 - 4;
  let starts = [], ends = [], endB = { row: 0, x: ML };   // 글자 칸의 왼쪽/오른쪽 경계(캐럿 후보)
  let lastRulesKey = '';
  const grainMask = $('grainMask'), grainRect = grainMask.firstElementChild;
  function sizeGrainMask(W, H) {   // 마스크는 종이 크기만큼만 (너무 크면 매 프레임 느려진다)
    for (const n of [grainMask, grainRect]) { n.setAttribute('width', Math.ceil(W)); n.setAttribute('height', Math.ceil(H)); }
  }

  function layout(instant) {
    const W = paper.clientWidth / Z;      // 확대할수록 한 줄에 들어가는 폭(단위)이 줄어든다
    const maxX = W - ML - 28;
    let x = freeMode ? anchor.x - ML : 0, row = freeMode ? anchor.row : 0;
    starts = []; ends = [];
    for (let i = 0; i < slots.length; i++) {
      const slot = slots[i];
      if (slot.ch === '\n') {
        starts[i] = { row, x: ML + x };
        slot.row = row; slot.ox = ML + x; slot.oy = rowY(row);
        x = 0; row++;
        slot.nx = ML; slot.ny = rowY(row) + G * 0.55;
        continue;
      }
      const adv = advance(slot.ch);
      if (x + adv > maxX && x > 0) { x = 0; row++; }
      starts[i] = { row, x: ML + x };
      ends[i] = { row, x: ML + x + adv };
      slot.row = row;
      slot.ox = ML + x + (adv - G) / 2;
      slot.oy = rowY(row);
      slot.nx = ML + x + adv; slot.ny = slot.oy + G * 0.55;
      // 위치·글자·배율이 그대로면 다시 계산하지 않는다 (긴 글에서도 가볍게)
      const sig = slot.ox + '|' + slot.oy + '|' + Z + '|' + slot.key;
      if (instant || slot.sig !== sig) { slot.sig = sig; applyGeometry(slot, instant); }
      x += adv;
    }
    endB = { row, x: ML + x };
    rowsUsed = row + 1;
    if (freeMode) {                       // 확정된 글자는 제자리에 고정
      for (const sl of committed) {
        const adv = advance(sl.ch);
        sl.ox = sl.fx + (adv - G) / 2; sl.oy = rowY(sl.frow); sl.row = sl.frow;
        sl.nx = sl.fx + adv; sl.ny = sl.oy + G * 0.55;
        const sig = sl.ox + '|' + sl.oy + '|' + Z + '|' + sl.key;
        if (instant || sl.sig !== sig) { sl.sig = sig; applyGeometry(sl, instant); }
        if (sl.frow + 1 > rowsUsed) rowsUsed = sl.frow + 1;
      }
    }
    const H = Math.max(rowsUsed * LH + MT + 60, (window.innerHeight - 110) / Z);
    layoutW = W; layoutH = H;
    board.setAttribute('height', H * Z);
    board.setAttribute('viewBox', `0 0 ${W} ${H}`);
    sizeGrainMask(W, H);
    drawRules(W, H);
    if (queue.length === 0 && pen.mode === 'idle' && slots.length === 0 && !freeMode) restPen();
    updateCaret();
  }

  function drawRules(W, H) {
    const key = W + 'x' + H;
    if (key === lastRulesKey) return;
    lastRulesKey = key;
    const n = Math.floor((H - MT) / LH);
    let html = '';
    for (let r = 0; r < n; r++) {
      const y = MT + r * LH + 58;
      html += `<line class="rule" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`;
    }
    html += `<line class="margin" x1="${ML - 26}" x2="${ML - 26}" y1="0" y2="${H}"/>`;
    rules.innerHTML = html;
  }

  // ───────── 캐럿(연필이 따라가야 할 자리) ─────────
  function caretBound(i) {
    if (i > 0 && ends[i - 1]) return ends[i - 1];
    if (i < slots.length && starts[i]) return starts[i];
    return endB;
  }
  function caretXY(i) {
    const b = caretBound(i);
    return { x: b.x, y: rowY(b.row) + G * 0.55 };
  }
  function candidates() {
    const c = [];
    starts.forEach((b, i) => { if (b) c.push({ idx: i, row: b.row, x: b.x }); });
    ends.forEach((b, i) => { if (b) c.push({ idx: i + 1, row: b.row, x: b.x }); });
    c.push({ idx: slots.length, row: endB.row, x: endB.x });
    return c;
  }
  function nearest(row, x) {
    let best = slots.length, bd = Infinity;
    for (const c of candidates()) {
      const d = Math.abs(c.row - row) * 100000 + Math.abs(c.x - x);
      if (d < bd) { bd = d; best = c.idx; }
    }
    return best;
  }

  // ───────── 입력 반영 (공통 접두/접미를 빼고 바뀐 부분만 처리) ─────────
  function sync(text, instant, isDelete, fast) {
    const animate = pencilOn && !instant;
    batch = (isDelete && animate) ? { items: [], after: [], fast: !!fast } : null;
    const nc = Array.from(text), oc = prevChars;
    let p = 0;
    while (p < nc.length && p < oc.length && nc[p] === oc[p]) p++;
    let s = 0;
    while (s < nc.length - p && s < oc.length - p && nc[nc.length - 1 - s] === oc[oc.length - 1 - s]) s++;

    const oldMid = slots.slice(p, oc.length - s);
    const midChars = nc.slice(p, nc.length - s);
    const bulk = !animate || midChars.length > 3;
    const newMid = midChars.map((ch, j) => setSlot(oldMid[j], ch, bulk));
    for (let j = midChars.length; j < oldMid.length; j++) removeSlot(oldMid[j]);

    slots = [...slots.slice(0, p), ...newMid, ...slots.slice(oc.length - s)];
    prevChars = nc;
    const b = batch; batch = null;
    if (b) finalizeBatch(b);
    layout(!pencilOn);
    // 지운 뒤에는 연필이 캐럿 자리로 돌아온다 (꾹 누르는 중에는 지우개가 계속 쓸고 간다)
    if (b && !b.fast) queue.push({ kind: 'move', caret: true, dead: false });
    if (!pencilOn && !instant) ensureVisible(endPos().y);   // 연필을 꺼도 화면은 따라간다
    updateStats(nc);
  }

  // ───────── 연필 ─────────
  const pen = { x: ML, y: MT + LH * 0.7, mode: 'idle', task: null, t0: 0, dur: 0,
                fx: 0, fy: 0, tx: 0, ty: 0, len: 0, lift: 0, erasing: false };
  // 연필을 "다음에 쓸 자리"로 (확대/축소·리사이즈 후, 처음 상태)
  function endPos() {
    if (freeMode) return { x: endB.x, y: rowY(endB.row) + G * 0.55 };
    return caretXY(activeCaret());
  }
  function restPen() { const p = endPos(); pen.x = p.x; pen.y = p.y; }
  const smooth = t => t * t * (3 - 2 * t);
  const lerp = (a, b, t) => a + (b - a) * t;

  function taskStart(t) {
    if (t.kind === 'move') return (t.slot && !t.caret) ? { x: t.slot.nx, y: t.slot.ny } : endPos();
    if (t.kind === 'erase') {
      return t.fast ? { x: t.bb.x1, y: (t.bb.y0 + t.bb.y1) / 2 }
                    : { x: t.bb.x0, y: t.bb.y0 + (t.bb.y1 - t.bb.y0) * 0.2 };
    }
    if (t.kind === 'text') return { x: t.x, y: t.y - 6 };
    return t.ld.getPointAtLength(0);
  }
  function taskLen(t) { return t.kind === 'text' ? t.w * 1.4 : t.ld.getTotalLength(); }
  function taskPoint(t, p) {
    if (t.kind === 'erase') {
      // 좌우로 삐꼭삐꼭 문지르며 천천히 내려간다
      const { x0, y0, x1, y1 } = t.bb;
      if (t.fast) return { x: x1 - p * (x1 - x0), y: (y0 + y1) / 2 + Math.sin(p * Math.PI * 4) * 3 };
      const u = p * (2 + Math.round((x1 - x0) / 60)) * 2;
      const tri = 1 - Math.abs((u % 2) - 1);
      return { x: x0 + tri * (x1 - x0), y: y0 + (0.2 + 0.6 * p) * (y1 - y0) };
    }
    if (t.kind === 'text') return { x: t.x + p * t.w, y: t.y - 6 };
    return t.ld.getPointAtLength(p * t.len);
  }
  function taskSet(t, p) {
    t.prog = p;
    if (t.kind === 'erase') {
      const e = smooth(Math.max(0, (p - 0.15) / 0.85));
      for (const o of t.els) o.el.style.opacity = (o.base * (1 - e)).toFixed(3);
    } else if (t.kind === 'text') t.rect.setAttribute('width', p * (t.w + 6));
    else setProg(t, p);
  }
  function isDead(t) { return t.dead; }

  function ensureVisible(y) {
    const top = paper.getBoundingClientRect().top + window.scrollY + y * Z;
    const bottom = window.scrollY + window.innerHeight - 140;
    if (top > bottom) window.scrollTo({ top: top - window.innerHeight + 200, behavior: 'smooth' });
  }

  // 애니메이션 없이 완성 상태로 만든다 (연필 끄기, 지우기 등)
  function finishTask(t) {
    if (!t || t.dead) return;
    if (t.kind === 'erase') eraseCleanup(t);
    else if (t.kind === 'text') t.rect.setAttribute('width', 400);
    else if (t.kind === 'stroke') setProg(t, 1);
  }

  let soundActive = false;
  function placeTool(node, x, y) {
    node.style.transform = `translate(${(x * Z).toFixed(1)}px,${(y * Z).toFixed(1)}px) scale(${Z})`;
  }

  function frame(now) {
    // 위치 보간
    for (const st of tweens) {
      const a = st.anim;
      if (!a) { tweens.delete(st); continue; }
      const k = Math.min(1, (now - a.t0) / a.dur), e = smooth(k);
      st.cur = a.from.map((v, i) => lerp(v, a.to[i], e));
      setStrokeD(st);

  requestAnimationFrame(frame);

  // ───────── 글자 수 ─────────

  // ───────── 선택 / 캐럿 ─────────

    const old = btn.textContent;
    try {
      const W = layoutW;
      const H = Math.min(layoutH, Math.max((rowsUsed + 1) * LH + MT + 10, 5 * LH + MT + 10));
      const S = Math.max(1.5, 2 * Z);
      const clone = glyphs.cloneNode(true);
      clone.querySelectorAll('g[clip-path]').forEach(n => n.remove());   // 영문 등은 캔버스에서 따로
      clone.querySelectorAll('.sel').forEach(n => n.classList.remove('sel'));
      clone.querySelectorAll('.lead,.hi').forEach(n => { n.style.strokeDashoffset = '0'; n.classList.remove('fade', 'erasing'); });
      const css = '.lead{fill:none;stroke:#34343b;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}' +
        '.hi{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.7;transform:translate(.9px,.9px)}' +
        '.rule{stroke:rgba(110,130,160,.38);stroke-width:1}.margin{stroke:rgba(210,110,110,.38);stroke-width:1}';
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W * S}" height="${H * S}" viewBox="0 0 ${W} ${H}">` +
        `<style>${css}</style><defs>${board.querySelector('defs').innerHTML}</defs>` +
        `<g>${rules.innerHTML}</g>${new XMLSerializer().serializeToString(clone)}</svg>`;
      const img = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));

      const c = document.createElement('canvas');
      c.width = Math.round(W * S); c.height = Math.round(H * S);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#f8f4ea'; ctx.fillRect(0, 0, c.width, c.height);
      try {
        const m = /url\(["']?(.*?)["']?\)$/.exec(getComputedStyle(paper).backgroundImage);
        if (m) {
          const noise = await loadImg(m[1].replace(/\\"/g, '"'));
          ctx.fillStyle = ctx.createPattern(noise, 'repeat'); ctx.fillRect(0, 0, c.width, c.height);
        }
      } catch {}
      ctx.drawImage(img, 0, 0, c.width, c.height);

      if (document.fonts) await document.fonts.ready;
      ctx.fillStyle = '#34343b'; ctx.globalAlpha = 0.9;
      ctx.font = `${38 * S}px "Yeon Sung", cursive`;
      for (const sl of allItems()) if (sl.text) ctx.fillText(sl.text.ch, sl.text.x * S, sl.text.y * S);
      ctx.globalAlpha = 1;

      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const d = new Date(), z = n => String(n).padStart(2, '0');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `끄적끄적-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.png`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      btn.textContent = '저장됨';
    } catch (err) {
      console.error(err);
      btn.textContent = '저장 실패';
    }
    setTimeout(() => { btn.textContent = old; }, 1500);
  }
  $('save').addEventListener('click', e => { savePng(e.currentTarget); pad.focus(); });

  // ───────── 소리 / 복사 / 지우기 ─────────
  const soundBtn = $('sound');
  function renderSound() { soundBtn.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐'; }
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; store.set('sound', soundOn ? 'on' : 'off'); renderSound();
    if (!soundOn) penSound(false);
    pad.focus();
  });
  $('copy').addEventListener('click', async (e) => {
    const b = e.currentTarget, old = b.textContent;
    const text = freeMode ? freeText() : pad.value;
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    b.textContent = '복사됨'; setTimeout(() => { b.textContent = old; }, 1200);
    pad.focus();
  });

  // 지우기: 종이를 구겨서 쓰레기통으로 버린다
  function clearAll() {
    queue.length = 0; tweens.clear();
    glyphs.replaceChildren();                       // 이전 글씨가 잠깐이라도 남지 않게 즉시 비운다
    board.querySelectorAll('defs clipPath').forEach(c => c.remove());
    slots = []; committed = []; prevChars = []; selSlots = [];
    pad.value = '';
    anchor = { row: 0, x: ML };
    pen.mode = 'idle'; pen.erasing = false;
    eraser.style.display = 'none';
    if (pencilOn) pencil.style.display = '';
    layout(true);
    restPen();
    lastSig = sigNow();
    updateStats(); updateCaret(); persist();
  }

  // 구겨진 종이 덩어리: 면마다 밝기가 다른 다각형으로 그린다
  function drawBall(cv) {
    const c = cv.getContext('2d'), W = cv.width, cx = W / 2, cy = W / 2, R = W * 0.4;
    c.clearRect(0, 0, W, W);
    const rings = [{ n: 1, r: 0 }, { n: 6, r: 0.3 }, { n: 11, r: 0.55 }, { n: 17, r: 0.8 }, { n: 24, r: 1 }];
    const pts = rings.map((rg, ri) => Array.from({ length: rg.n }, (_, k) => {
      const a = (k / rg.n) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      const rr = rg.r === 0 ? 0 : R * rg.r * (ri === 4 ? 0.78 + Math.random() * 0.37 : 0.8 + Math.random() * 0.4);
      return { x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr };
    }));
    const tris = [];
    for (let k = 0; k < 6; k++) tris.push([pts[0][0], pts[1][k], pts[1][(k + 1) % 6]]);
    for (let ri = 1; ri < 4; ri++) {
      const A = pts[ri], B = pts[ri + 1];
      let i = 0, j = 0;
      while (i < A.length || j < B.length) {
        const stepA = i < A.length && (j >= B.length || (i + 1) / A.length <= (j + 1) / B.length);
        if (stepA) { tris.push([A[i % A.length], A[(i + 1) % A.length], B[j % B.length]]); i++; }
        else { tris.push([A[i % A.length], B[j % B.length], B[(j + 1) % B.length]]); j++; }
      }
    }
    c.lineJoin = 'round';
    for (const t of tris) {
      const mx = (t[0].x + t[1].x + t[2].x) / 3 - cx, my = (t[0].y + t[1].y + t[2].y) / 3 - cy;
      const len = Math.hypot(mx, my) || 1;
      const lit = 0.76 + 0.2 * -((mx / len) * 0.6 + (my / len) * 0.8) * Math.min(1, len / R) + (Math.random() - 0.5) * 0.55;
      const l = Math.max(0.42, Math.min(1, lit));
      c.fillStyle = `rgb(${Math.round(212 * l + 38)},${Math.round(213 * l + 39)},${Math.round(226 * l + 30)})`;
      c.strokeStyle = 'rgba(70,75,95,.2)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(t[0].x, t[0].y); c.lineTo(t[1].x, t[1].y); c.lineTo(t[2].x, t[2].y); c.closePath();
      c.fill(); c.stroke();
    }
    for (let k = 0; k < 9; k++) {          // 접힌 자국
      const a = Math.random() * Math.PI * 2, b = a + Math.PI * (0.6 + Math.random() * 0.8);
      const r1 = R * (0.3 + Math.random() * 0.6), r2 = R * (0.3 + Math.random() * 0.6);
      c.strokeStyle = Math.random() < 0.5 ? 'rgba(60,65,85,.22)' : 'rgba(255,255,255,.5)';
      c.lineWidth = 1 + Math.random() * 1.4;
      c.beginPath(); c.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      c.lineTo(cx + Math.cos(b) * r2, cy + Math.sin(b) * r2); c.stroke();
    }
  }

  let trashing = false;
  const clearBtn = $('clear'), ball = $('ball');
  clearBtn.addEventListener('click', () => {
    if (trashing) return;
    if (!allItems().length) { clearBtn.classList.add('bump'); setTimeout(() => clearBtn.classList.remove('bump'), 400); pad.focus(); return; }
    trashing = true;
    audioInit();
    const r = paper.getBoundingClientRect(), t = clearBtn.getBoundingClientRect();
    const oy = Math.max(0, Math.min(r.height, window.innerHeight / 2 - r.top));   // 화면 중앙에서 구긴다
    const cx = r.left + r.width / 2, cy = r.top + oy;
    paper.style.transformOrigin = `50% ${oy}px`;
    paper.style.setProperty('--s', String(Math.min(1, 150 / r.width)));
    paper.classList.add('crumple');
    crumpleSound();
    setTimeout(() => {                         // 구겨진 덩어리가 쓰레기통으로 날아간다
      drawBall(ball);
      ball.style.left = (cx - 75) + 'px'; ball.style.top = (cy - 75) + 'px';
      ball.style.setProperty('--bx', (t.left + t.width / 2 - cx) + 'px');
      ball.style.setProperty('--by', (t.top + t.height / 2 - cy) + 'px');
      ball.style.display = 'block';
      ball.classList.remove('fly'); void ball.offsetWidth; ball.classList.add('fly');
      paper.style.visibility = 'hidden';       // 안 보이는 사이에 비우고 새 종이를 준비한다
      paper.classList.remove('crumple');
      paper.style.transformOrigin = '';
      clearAll();
    }, 560);
    setTimeout(() => {
      ball.style.display = 'none'; ball.classList.remove('fly');
      paper.style.visibility = '';
      paper.classList.add('fresh');
      clearBtn.classList.add('bump');
      setTimeout(() => {
        paper.classList.remove('fresh'); clearBtn.classList.remove('bump');
        trashing = false; pad.focus();
      }, 420);
    }, 560 + 640);
  });

  // 디버깅/테스트용
  window.__ssg = { sync, pad, pen, queue, setPencil };

  // ───────── 흑연 입자 텍스처 (한 번만 생성) ─────────
  (function initGrain() {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    const im = g.createImageData(128, 128);
    for (let i = 0; i < 128 * 128; i++) {
      im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = 255;
      im.data[i * 4 + 3] = 85 + Math.random() * 170;
    }
    g.putImageData(im, 0, 0);
    const url = c.toDataURL();
    const img = $('grainImg');
    img.setAttribute('href', url);
    img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', url);
  })();

  // ───────── 시작 ─────────
  renderSound();
  const ss = parseInt(store.get('speed'), 10);
  if (ss >= 0 && ss < SPEEDS.length) { si = ss; userSpeed = SPEEDS[si]; }
  renderSpeed();
  const zs = parseInt(store.get('zoom'), 10);
  if (zs >= 0 && zs < ZOOMS.length) zi = zs;
  Z = ZOOMS[zi];
  $('zoomLabel').textContent = Math.round(Z * 100) + '%';
  pencilOn = store.get('pencil') !== 'off';
  $('pencilBtn').textContent = pencilOn ? '연필 켜짐' : '연필 꺼짐';
  if (!pencilOn) { pencil.style.display = 'none'; }
  const savedMode = store.get('mode');
  let savedItems = null;
  try { savedItems = JSON.parse(store.get('items') || 'null'); } catch {}
  if (savedMode !== 'memo' && Array.isArray(savedItems)) {
    for (const it of savedItems) {              // 종이 고정: 저장된 좌표 그대로 복원
      const sl = setSlot(null, it[0], true);
      sl.fx = it[1]; sl.frow = it[2]; sl.free = true;
      committed.push(sl);
    }
    pad.value = '';
    layout(true);
  } else {
    const saved = store.get('text') || '';      // 메모 글(또는 이전 버전 글): 흘려 쓴 뒤 필요하면 종이에 고정
    freeMode = false;
    pad.value = saved;
    pad.setSelectionRange(pad.value.length, pad.value.length);
    layout(true);
    sync(saved, true);
    if (savedMode !== 'memo') setFree(true);
  }
  $('freeBtn').textContent = freeMode ? '종이 고정 켜짐' : '종이 고정 꺼짐';
  lastSig = sigNow();
  restPen();
  updateStats();
  updateCaret();
  document.fonts && document.fonts.ready.then(() => layout(true));
})();
</script>
</body>
</html>
